const statsTop=document.getElementById('statsTop');
const statusGrid=document.getElementById('statusGrid');
const messageBox=document.getElementById('messageBox');
const mapList=document.getElementById('mapList');
const towerList=document.getElementById('towerList');
const baseInfo=document.getElementById('baseInfo');
const modChips=document.getElementById('modChips');
const overlay=document.getElementById('overlay');
const overlayBody=document.getElementById('overlayBody');
const overlayTitle=document.getElementById('overlayTitle');
const overlaySub=document.getElementById('overlaySub');

function codexKillTotal(){
  const c=state.codex||{};
  let n=0;
  for(const v of Object.values(c.enemies||{})) n+=(+v||0);
  for(const v of Object.values(c.bosses||{})) n+=(+v||0);
  return n;
}
function codexSummaryText(){
  const eCount=ENEMY_TYPES.filter(t=>!t.__modId||state.activeMods.has(t.__modId)).length;
  const bCount=BOSS_TYPES.filter(b=>!b.__modId||state.activeMods.has(b.__modId)).length;
  return `已收录 ${eCount} 种小怪 · ${bCount} 种 Boss · 累计击杀 ${codexKillTotal().toLocaleString()}。`;
}

function renderWavePreview(){
  const el=document.getElementById('wavePreview'); if(!el)return;
  const plan=state.waveState==='ready'?previewWave(state.wave):(state.wavePlan||previewWave(state.wave));
  const parts=[];
  for(const t of ENEMY_TYPES){
    const n=plan.counts[t.id]||0;
    if(n>0) parts.push(`<span class="waveChip${(t.armor||0)>=.2?' heavy':''}">${t.name} ×${n}</span>`);
  }
  if(plan.boss){
    const bt=plan.boss;
    parts.push(`<span class="waveChip boss">${bt.icon} ${bt.name} ×${plan.counts['boss:'+bt.id]||1}</span>`);
  }
  el.innerHTML=`<div class="muted" style="font-size:12px;margin-top:6px">第 <b style="color:var(--text)">${plan.wave}</b> 波 · 共 ${plan.total} 个敌人${plan.boss?' · <span style="color:var(--amber)">BOSS 波</span>':''}</div>
    <div class="waveComp">${parts.join('')||'<span class="waveChip">—</span>'}</div>`;
  const ab=document.getElementById('autoWaveBtn');
  if(ab){
    ab.textContent=`自动下一波：${state.autoWave?'开':'关'}`;
    ab.classList.toggle('active',state.autoWave);
  }
}

function renderStatic(){
  statsTop.innerHTML=[
    ['金币',state.gold,'var(--amber)','statGold'],
    ['基地HP',`${Math.ceil(state.base.hp)}/${state.base.maxHp}`,'var(--rose)','statHp'],
    ['技能点',state.skillPoints,'var(--cyan)','statSp'],
    ['波次',state.wave,'var(--green)','statWave'],
    ['剩余敌人',state.enemies.reduce((n,e)=>n+(e.alive?1:0),0),'var(--violet)','statRemain']
  ].map(([k,v,c,id])=>`<div class="stat"><small>${k}</small><b id="${id}" style="color:${c}">${v}</b></div>`).join('');
  state._uiCache={gold:state.gold,hp:Math.ceil(state.base.hp),hpMax:state.base.maxHp,
    skillPoints:state.skillPoints,wave:state.wave,enemyCount:null,waveTag:null};

  statusGrid.innerHTML=`
    <div class="cardMini"><div class="k">选中塔</div><div class="v" style="font-size:15px">${state.selectedTowerId?'已选中':'未选择'}</div></div>
    <div class="cardMini"><div class="k">地图</div><div class="v" style="font-size:15px">${currentMap().name}</div></div>
    <div class="cardMini"><div class="k">场上敌人</div><div class="v" id="statEnemyCount">${state.enemies.reduce((n,e)=>n+(e.alive?1:0),0)}</div></div>
    <div class="cardMini"><div class="k">难度</div><div class="v" style="font-size:15px">${mapEnemyHpMul().toFixed(2)}×</div></div>`;

  if(messageBox.textContent!==state.message){
    messageBox.textContent=state.message;
    messageBox.classList.remove('msgFlash');
    void messageBox.offsetWidth; // force reflow so a rapid second message still re-flashes
    messageBox.classList.add('msgFlash');
  }
  document.getElementById('pauseBtn').textContent=state.paused?'继续':'暂停';
  document.getElementById('speedBtn').textContent=`倍速 ×${state.gameSpeed}`;
  document.getElementById('soundBtn').textContent=`音效：${state.soundOn?'开':'关'}`;
  renderWavePreview();
  updateWavePanel();
  updateAutoSaveUI();
  const codexSummary=document.getElementById('codexSummary');
  if(codexSummary) codexSummary.textContent=codexSummaryText();
  state._uiCache.codexKills=codexKillTotal();

  // Base info panel
  const b=state.base; const pct=b.hp/b.maxHp;
  const bst=baseEffectiveStats();
  const regen=baseRegenPerSec();
  const nextCost=baseUpgradeCost();
  const hpColor=pct>.6?'#4ade80':pct>.3?'#fbbf24':'#f87171';
  baseInfo.innerHTML=`
    <div class="grid2">
      <div class="cardMini"><div class="k">等级</div><div class="v">Lv.${b.level}</div></div>
      <div class="cardMini"><div class="k">血量</div><div class="v" id="baseHpText" style="color:${hpColor};font-size:16px">${Math.ceil(b.hp)}/${b.maxHp}</div></div>
      <div class="cardMini"><div class="k">伤害</div><div class="v">${bst.damage}</div></div>
      <div class="cardMini"><div class="k">射程</div><div class="v">${bst.range.toFixed(1)} 格</div></div>
      <div class="cardMini" style="grid-column:1/-1"><div class="k">自动回血（科技「基地再生」）</div><div class="v" id="baseRegenText" style="font-size:16px;color:${regen>0?'var(--green)':'rgba(255,255,255,.35)'}">${regen>0?`+${regen.toFixed(1)} HP/秒`:'未解锁'}</div></div>
    </div>
    <div class="baseBar" style="margin-top:8px"><div class="baseBarFill" id="baseHpFill" style="width:${pct*100}%;background:linear-gradient(90deg,${hpColor},${pct>.6?'#7dffbb':'#ffd36b'})"></div></div>
    <button class="btn primary" id="upgradeBaseBtn" style="width:100%;margin-top:9px">升级基地（${nextCost} 金币）</button>
    <div class="footerTip">升级：+140 最大血量 +16 伤害，并回复部分血量。<br>基地射程短但伤害高，是最后一道防线。</div>`;
  document.getElementById('upgradeBaseBtn').onclick=upgradeBase;

  mapList.innerHTML=MAPS.filter(m=>!m.__modId||state.activeMods.has(m.__modId)).map(m=>`
    <button class="mapBtn ${m.id===state.stageId?'active':''}" data-map="${m.id}">
      <div class="row"><strong>${m.name}${m.__modId?' <span class="tag" style="background:rgba(125,255,187,.18);color:var(--green)">模组</span>':''}</strong><span class="tag">${m.bossName}</span></div>
      <div class="muted" style="margin-top:5px">${m.desc}</div>
    </button>`).join('');

  // Tower list — pure reference cards now (building happens through the radial menu)
  towerList.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px">`+
    Object.entries(TOWER_TYPES).filter(([,v])=>!v.__modId||state.activeMods.has(v.__modId)).map(([k,v])=>{
    const isSL=k==='superLaser';
    const dps=Math.round((v.baseDamage||0)/Math.max(.15,v.baseFireRate||1));
    const col=v.color||[200,200,200];
    const rgb=`rgb(${col[0]},${col[1]},${col[2]})`;
    return `<div class="towerCard" style="${isSL?'border-color:rgba(0,240,255,.35);background:rgba(0,240,255,.06)':''}">
      <div class="ti" style="color:${rgb};border-color:${rgb}66;box-shadow:0 0 12px ${rgb}33">${v.icon||'⬡'}</div>
      <div class="tbody">
        <div class="row">
          <strong style="${isSL?'color:var(--cyan)':''}">${v.name}${v.__modId?' <span class="tag" style="background:rgba(125,255,187,.18);color:var(--green)">模组</span>':''}</strong>
          <span class="tag" style="${isSL?'background:rgba(0,240,255,.2);color:var(--cyan)':''}">${v.cost} 金</span>
        </div>
        <div class="muted" style="margin-top:4px">${v.desc}</div>
        <div class="foot">${isSL
          ?`伤害 ${v.baseDamage} · 全图覆盖 · 占地2×2 · 不可升级`
          :`伤害 ${v.baseDamage}｜射程 ${v.baseRange.toFixed(1)} 格｜秒伤≈${dps}${v.splash?'｜群伤':''}${v.pierce?'｜穿透'+(v.pierce+1):''}`}</div>
      </div>
    </div>`;
  }).join('')+`</div>`;

  // Mod chips in sidebar
  const active=[...state.activeMods].map(id=>window.__mods.find(m=>m.id===id)).filter(Boolean);
  modChips.innerHTML=active.length===0
    ?`<span style="font-size:12px;color:rgba(255,255,255,.28)">无已启用模组</span>`
    :active.map(m=>`<span style="display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:rgba(110,231,255,.14);border:1px solid rgba(110,231,255,.26);font-size:11px;color:var(--cyan)">🧩 ${m.name}</span>`).join('');
}

/* ═══════════════════════════════════════════════════════════
   OVERLAY
   ═══════════════════════════════════════════════════════════ */
function renderOverlay(payload=null){
  const mode=state.overlayMode;
  const titles={tech:'科技树',tower:'炮台升级',tunnel:'⛏ 地道封堵',saves:'🗂 历史存档',mods:'🧩 模组管理',base:'🏰 基地升级',codex:'📖 怪物图鉴',resume:'继续上次进度'};
  const tn=state.overlayMode==='tunnel'?(state.tunnels.find(x=>x.id===payload)||null):null;
  overlayTitle.textContent=titles[mode]||'信息';
  overlaySub.textContent=
    mode==='tech'?`共${TECHS.filter(n=>!n.__modId||state.activeMods.has(n.__modId)).length}项科技 · 已解锁${Object.values(state.skills).filter(v=>v>0).length}项 · 可无限升级`:
    mode==='tower'?'点击升级可连续加点':
    mode==='tunnel'?(tn?(tn.status==='open'?'地道已贯通 · 敌人正在抄近路':'地道正在挖掘'):'地道已消失'):
    mode==='saves'?'本机保存 · 重启不丢失 · 30 天未打开自动清理':
    mode==='mods'?`已加载 ${window.__mods.length} 个 · 已启用 ${state.activeMods.size} 个`:
    mode==='base'?`基地 Lv.${state.base.level}`:
    mode==='codex'?`当前第 ${state.wave} 波数值 · 击杀记录永久保存`:
    mode==='resume'?'检测到本机自动存档':
    '';

  if(mode==='saves'){
    const list=readSaveHistory();
    const fmt=ts=>{ const d=new Date(ts),p=n=>String(n).padStart(2,'0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
    overlayBody.innerHTML=`
      <div class="overlayGrid">
        <div class="bigCard">
          <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap">
            <div class="muted" style="font-size:12px">共 <strong style="color:var(--cyan)">${list.length}</strong> 条 · 每条都带有地图本身，自定义地图也能读回</div>
            <button class="btn primary" id="saveNowBtn">📌 保存当前进度</button>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:52vh;overflow:auto">
            ${list.length?list.map(r=>`
              <div class="bigCard" style="padding:10px;background:rgba(255,255,255,.03)">
                <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
                  <div>
                    <div style="font-weight:700">${r.mapName||r.data.mapName||r.data.stageId} · 第 ${r.wave} 波</div>
                    <div class="muted" style="font-size:11.5px;margin-top:3px">${r.towers} 座炮台 · 保存 ${fmt(r.savedAt)} · 末次打开 ${fmt(r.lastOpenedAt||r.savedAt)}</div>
                  </div>
                  <div style="display:flex;gap:6px">
                    <button class="btn small primary" data-load-save="${r.id}">载入</button>
                    <button class="btn small danger" data-del-save="${r.id}">删除</button>
                  </div>
                </div>
              </div>`).join(''):'<div class="muted" style="padding:18px 6px;text-align:center">还没有历史存档。点右上角「保存当前进度」或侧栏的「保存当前进度到历史」。</div>'}
          </div>
        </div>
      </div>`;
    const nowBtn=document.getElementById('saveNowBtn');
    if(nowBtn) nowBtn.onclick=()=>{ saveToHistory(false,state.runId?('run_'+state.runId):null); openOverlay('saves'); };
    overlayBody.querySelectorAll('[data-load-save]').forEach(b=>b.onclick=()=>loadSaveHistory(b.dataset.loadSave));
    overlayBody.querySelectorAll('[data-del-save]').forEach(b=>b.onclick=()=>deleteSaveHistory(b.dataset.delSave));
    return;
  }

  if(mode==='tunnel'){
    if(!tn){ closeOverlay(); return; }
    const cost=tunnelRepairCost();
    const p=pointAtDistance(tn.entryD,tn.route), q=pointAtDistance(tn.exitD,tn.route);
    overlayBody.innerHTML=`
      <div class="overlayGrid">
        <div class="bigCard">
          <h3 style="margin:0 0 8px;color:#e6b17a">⛏ 敌军地道</h3>
          <div class="notice" style="margin-bottom:10px;font-size:12px">
            ${tn.status==='open'?'这条地道已经贯通：后续敌人会从入口直接跳到出口，跳过中间大部分路线。':'掘地兽还在挖，贯通后敌人就会开始抄近路。'}
          </div>
          <div class="grid2">
            <div class="cardMini"><div class="k">状态</div><div class="v" style="color:${tn.status==='open'?'#ff9d5c':'#fbbf24'}">${tn.status==='open'?'已贯通':'挖掘中'}</div></div>
            <div class="cardMini"><div class="k">路线</div><div class="v">第 ${tn.route+1} 条</div></div>
            <div class="cardMini"><div class="k">入口位置</div><div class="v" style="font-size:13px">${Math.round(tn.entryD)} / ${Math.round(getPathData(tn.route).len)} 格</div></div>
            <div class="cardMini"><div class="k">出口距基地</div><div class="v" style="font-size:13px">${Math.max(0,Math.round(getPathData(tn.route).len-tn.exitD))} 格</div></div>
          </div>
          <div class="footerTip" style="margin-top:10px">封堵后地道消失，洞里的敌人会被赶回入口；本局每封堵一次，下一次价格 +250 金币。</div>
          <button class="btn primary" id="repairTunnelBtn" style="width:100%;margin-top:10px" ${state.gold<cost?'disabled':''}>🧱 封堵地道（${cost} 金币）</button>
        </div>
      </div>`;
    const btn=document.getElementById('repairTunnelBtn');
    if(btn) btn.onclick=()=>repairTunnel(tn.id);
    return;
  }

  if(mode==='tower'){
    const t=state.towers.find(x=>x.id===(payload||state.selectedTowerId));
    if(!t){closeOverlay();return;}

    // ── SuperLaser special overlay ──
    if(t.type==='superLaser'){
      const target=t.targetId?state.enemies.find(e=>e.id===t.targetId&&e.alive):null;
      const isPriority=target&&state.priorityTargetId===target.id;
      const charge=Math.max(0,1-t.cooldown/SUPERLASER_COOLDOWN);
      const sellVal=towerSellValue(t);
      const slDmg=superLaserStats().damage;
      overlayBody.innerHTML=`
        <div class="overlayGrid">
          <div class="bigCard">
            <h3 style="margin:0 0 8px;color:var(--cyan)">⚡ 激光炮 · 超级武器</h3>
            <div class="notice" style="margin-bottom:10px;font-size:12px">占地2×2 · 全图覆盖 · 自动攻击 · <strong>不可升级</strong></div>
            <div class="grid2">
              <div class="cardMini"><div class="k">伤害</div><div class="v" style="color:var(--cyan)">${slDmg}${slDmg>500?` <span style="font-size:11px;color:var(--green)">(基础500)</span>`:''}</div></div>
              <div class="cardMini"><div class="k">攻速</div><div class="v">0.5/s</div></div>
              <div class="cardMini"><div class="k">射程</div><div class="v" style="color:var(--green)">全图</div></div>
              <div class="cardMini"><div class="k">击杀</div><div class="v">${t.kills}</div></div>
            </div>
            <div style="margin-top:10px">
              <div id="slChargeLabel" style="font-size:12px;color:var(--muted);margin-bottom:4px">充能进度 ${Math.round(charge*100)}%</div>
              <div style="height:9px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden">
                <div id="slChargeFill" style="height:100%;width:${charge*100}%;background:linear-gradient(90deg,#00c8ff,#7dffbb);border-radius:inherit"></div>
              </div>
            </div>
            <div style="display:flex;gap:9px;margin-top:12px;flex-wrap:wrap">
              <button class="btn danger" id="slSellBtn">出售（${sellVal}金）</button>
            </div>
            <div class="footerTip" style="margin-top:8px">激光炮全自动攻击，无需手动操作。直接点击地图上的敌人可将其标记为<strong>全局优先目标</strong>，所有炮台（含激光炮）会优先集火它。</div>
          </div>
          <div class="bigCard">
            <h3 style="margin:0 0 9px">当前攻击目标</h3>
            <div id="slTargetPane">${target?`
              <div style="padding:12px;border-radius:16px;background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.3)">
                <div style="font-weight:700;font-size:15px;color:var(--cyan)">${target.boss?(target.icon+' '+target.bossTypeName):'普通敌人'} ${isPriority?'<span class="tag" style="background:rgba(255,140,0,.25);color:#ffb866;margin-left:6px">优先目标</span>':''}</div>
                <div id="slTargetHpLabel" style="margin-top:7px;font-size:13px;color:var(--muted)">HP：${Math.ceil(target.hp)} / ${target.maxHp}</div>
                <div style="height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px">
                  <div id="slTargetHpFill" style="height:100%;width:${(target.hp/target.maxHp)*100}%;background:${target.boss?'#ffd36b':'#fb7185'};border-radius:inherit"></div>
                </div>
                <div id="slTargetProgressLabel" style="font-size:11px;color:var(--muted);margin-top:5px">进度 ${Math.round(target.progress*100)}%</div>
              </div>`
            :`<div style="padding:20px;border-radius:16px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.12);text-align:center;color:var(--muted)">
                <div style="font-size:24px;margin-bottom:8px">⏳</div>
                场上暂无敌人，待机中
              </div>`}</div>
            ${state.priorityTargetId?`<button class="btn" id="slClearPriorityBtn" style="width:100%;margin-top:10px">清除全局优先目标</button>`:''}
            <div class="footerTip" style="margin-top:10px">无优先目标时，激光炮自动攻击最接近基地的敌人。</div>
          </div>
        </div>`;
      setTimeout(()=>{
        const sb=document.getElementById('slSellBtn');
        const cb=document.getElementById('slClearPriorityBtn');
        if(sb)sb.onclick=()=>{
          const idx=state.towers.findIndex(x=>x.id===t.id); if(idx<0)return;
          const sv=towerSellValue(t);
          state.gold+=sv; state.towers.splice(idx,1); state.selectedTowerId=null; state.towersRev++;
          setMsg(`激光炮已出售，回收 ${sv} 金。`);
          sfx('coin'); closeOverlay(); renderStatic(); scheduleAutoSave();
        };
        if(cb)cb.onclick=()=>{ state.priorityTargetId=null; setMsg('已清除全局优先目标。'); renderOverlay(t.id); renderStatic(); };
      },0);
      return;
    }

    // ── Normal tower overlay ──
    const st=effectiveStats(t),up=towerUpgradeCost(t),sell=towerSellValue(t);
    const ttype=TOWER_TYPES[t.type];
    const nextSt=effectiveStats({...t,level:t.level+1});
    const featureText=t.type==='cannon'?'范围爆炸（半径 '+(st.splashCells).toFixed(2)+' 格）':t.type==='frost'?'减速 '+(st.slow*100).toFixed(0)+'%（Boss 减半效果）':t.type==='laser'?'穿透 '+(1+st.pierce)+' 个目标 · 无视 '+(st.armorPen*100).toFixed(0)+'% 护甲':t.type==='mortar'?'超大范围爆炸（半径 '+(st.splashCells).toFixed(2)+' 格）':(ttype.__modId?'模组炮台':'标准弹道');
    overlayBody.innerHTML=`
      <div class="overlayGrid">
        <div class="bigCard">
          <h3 style="margin:0 0 9px">${ttype.name}${ttype.__modId?' <span class="tag" style="background:rgba(125,255,187,.18);color:var(--green)">模组</span>':''} · Lv.${t.level}</h3>
          <div class="grid2">
            <div class="cardMini"><div class="k">伤害</div><div class="v">${st.damage}<span style="font-size:12px;color:var(--green)"> → ${nextSt.damage}</span></div></div>
            <div class="cardMini"><div class="k">秒伤（单体）</div><div class="v">${st.dps.toFixed(1)}<span style="font-size:12px;color:var(--green)"> → ${nextSt.dps.toFixed(1)}</span></div></div>
            <div class="cardMini"><div class="k">射击间隔</div><div class="v">${st.cooldown.toFixed(2)}s</div></div>
            <div class="cardMini"><div class="k">射程</div><div class="v">${st.range.toFixed(2)}</div></div>
            <div class="cardMini"><div class="k">暴击率</div><div class="v">${(st.critChance*100).toFixed(0)}%</div></div>
            <div class="cardMini"><div class="k">击杀</div><div class="v">${t.kills}</div></div>
          </div>
          <div style="display:flex;gap:9px;margin-top:11px;flex-wrap:wrap">
            ${ttype.noUpgrade?`<button class="btn" disabled>该塔不可升级</button>`:`<button class="btn primary" id="upBtn">升级（${up} 金）</button>`}
            <button class="btn" id="sellBtn">出售（${sell} 金）</button>
          </div>
          <div class="footerTip" style="margin-top:8px">${ttype.noUpgrade?'这是一座固定强度的特殊塔。':'升级无上限，费用随等级提高；每级约 +26% 基础伤害。'}</div>
        </div>
        <div class="bigCard">
          <h3 style="margin:0 0 9px">当前特性</h3>
          <div class="muted" style="line-height:1.8">${ttype.desc}<br>${featureText}<br>
            已投入 ${t.invested||ttype.cost} 金 · 出售返还 60%</div>
        </div>
      </div>`;
    setTimeout(()=>{
      const b=document.getElementById('upBtn'); const s=document.getElementById('sellBtn');
      if(b)b.onclick=()=>{
        const t2=state.towers.find(x=>x.id===state.selectedTowerId); if(!t2)return;
        const cost=towerUpgradeCost(t2);
        if(state.gold<cost){setMsg(`升级需要 ${cost} 金，金币不足。`);return;}
        state.gold-=cost; t2.level+=1; t2.invested=(t2.invested||0)+cost; t2.flash=.12;
        state.shake=Math.max(state.shake,1.8);
        setMsg(`${TOWER_TYPES[t2.type].name} 升级到 Lv.${t2.level}`); sfx('upgrade');
        renderStatic(); renderOverlay(t2.id); callHook('onTowerUpgrade',t2); scheduleAutoSave();
      };
      if(s)s.onclick=()=>{
        const idx=state.towers.findIndex(x=>x.id===state.selectedTowerId); if(idx<0)return;
        const t2=state.towers[idx]; const sv=towerSellValue(t2);
        state.gold+=sv; state.towers.splice(idx,1); state.selectedTowerId=null; state.towersRev++;
        setMsg(`出售 +${sv} 金`); sfx('coin'); closeOverlay(); renderStatic(); scheduleAutoSave();
      };
    },0);
    return;
  }

  if(mode==='codex'){
    const wave=Math.max(1,state.wave);
    const enemies=ENEMY_TYPES.filter(t=>!t.__modId||state.activeMods.has(t.__modId));

      const boss=kind==='boss';

      const kills=boss?(state.codex.bosses[ent.id]||0):(state.codex.enemies[ent.id]||0);

      const dot=`rgb(${col[0]},${col[1]},${col[2]})`;

  if(mode==='tech'){

        「双轨前哨」等地图有多条出生路线，全部通向同一个基地。科技树里的「基地再生 / 纳米自愈」能让基地每秒自动回血。
      </div></div>
      <div class="bigCard"><h3 style="margin:0 0 9px">操作 · 快捷键</h3><div class="muted" style="line-height:1.9">
        触屏：轻点 = 操作，按住拖动 = 平移地图（松手带惯性），可双指滑动侧栏/科技树。<br>
        鼠标：左键 = 操作，左键拖动 = 平移地图，右键 = 取消选中 / 清除优先目标。<br>
        点按敌人：设为全炮台优先目标<br>
        空格：开始下一波 · P：暂停/继续 · A：开关自动开波 · C：怪物图鉴<br>
        ESC：关闭界面 / 收起建造盘
      </div></div>
      <div class="footerTip" style="margin-top:9px;text-align:center">游戏会在过波、购买和关闭页面时自动保存到本机浏览器；下次打开会询问是否继续。</div>
    </div>`;
}

/* ── Mod overlay ── */
function renderModOverlay(){
  overlayBody.innerHTML=`
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="notice">
        将 <strong>.js 模组文件</strong>拖入下方区域，或点击选择文件，即可直接加载模组。<br>
        <span style="font-size:12px;opacity:.75">模组可以新增炮台、地图、Boss、科技，也可以挂接游戏事件钩子。完整制作说明见随游戏附带的《模组制作说明书.txt》。</span>
      </div>
      <div class="modDropZone" id="modDropZone">
        <input type="file" accept=".js" multiple id="modFileInput" />
        <div style="font-size:28px;margin-bottom:10px">📦</div>
        <div style="font-weight:700;margin-bottom:6px">拖入 .js 模组文件</div>
        <div style="font-size:13px">或点击此处选择文件</div>
      </div>
      <div id="modErrorBox"></div>
      <div id="modCardList"></div>
    </div>`;

  const dropZone=document.getElementById('modDropZone');
  const fileInput=document.getElementById('modFileInput');
  const errorBox=document.getElementById('modErrorBox');

  function processFiles(files){
    let hasError=false;
    for(const file of files){
      if(!file.name.endsWith('.js')){
        errorBox.innerHTML+=`<div style="color:var(--rose);font-size:13px;padding:4px 0">⚠ ${file.name} 不是 .js 文件</div>`;
        hasError=true; continue;
      }
      const reader=new FileReader();
      reader.onload=e=>{
        const r=loadModFromText(file.name,e.target.result);
        if(r.ok){
          const wasActive=state.activeMods.has(r.mod.id);
          state.activeMods.add(r.mod.id);
          if(!wasActive&&typeof r.mod.hooks?.onEnable==='function'){
            try{ r.mod.hooks.onEnable(state); }catch(err){ console.warn(`[MOD:${r.mod.id}] onEnable:`,err); }
          }
          _previewCache.clear(); renderModCards(); renderStatic();
        }
        else { errorBox.innerHTML+=`<div style="color:var(--rose);font-size:13px;padding:4px 0">❌ ${file.name}：${r.err}</div>`; }
      };
      reader.readAsText(file);
    }
  }

  dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('drag');});
  dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('drag');processFiles(e.dataTransfer.files);});
  fileInput.addEventListener('change',()=>{processFiles(fileInput.files);fileInput.value='';});

  renderModCards();
}

function renderModCards(){
  const list=document.getElementById('modCardList'); if(!list)return;
  if(window.__mods.length===0){
    list.innerHTML=`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">还没有加载任何模组，拖入 .js 文件开始。</div>`;
    return;
  }
  list.innerHTML=window.__mods.map(mod=>{
    const on=state.activeMods.has(mod.id);
    return`<div class="modCard${on?' modOn':''}" data-modcard="${mod.id}">
      <div class="modInfo">
        <div class="modName">${mod.name}<span class="modBadge${on?' on':''}">${on?'已启用':'未启用'}</span></div>
        <div class="modDesc">${mod.desc||'（无描述）'}</div>
        <div class="modMeta">v${mod.version||'?'} ${mod.author?`· ${mod.author}`:''} ${mod._filename?`· ${mod._filename}`:''}</div>
        <button class="modRemove" data-modremove="${mod.id}">移除</button>
      </div>
      <button class="modToggle${on?' on':''}" data-modtoggle="${mod.id}">${on?'停用':'启用'}</button>
    </div>`;
  }).join('');
  list.querySelectorAll('[data-modtoggle]').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.modtoggle; const mod=window.__mods.find(m=>m.id===id);
      if(state.activeMods.has(id)){
        state.activeMods.delete(id);
        if(typeof mod?.hooks?.onDisable==='function') mod.hooks.onDisable(state);
        // If the currently selected tower type belongs to the disabled mod, fall back to cannon
        const selType=TOWER_TYPES[state.selectedTowerType];
        if(selType?.__modId===id) state.selectedTowerType='cannon';
      } else {
        state.activeMods.add(id);
        if(typeof mod?.hooks?.onEnable==='function') mod.hooks.onEnable(state);
      }
      _previewCache.clear(); renderModCards(); renderStatic();
    };
  });
  list.querySelectorAll('[data-modremove]').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.modremove; const mod=window.__mods.find(m=>m.id===id);
      if(state.activeMods.has(id)){
        state.activeMods.delete(id);
        if(typeof mod?.hooks?.onDisable==='function') mod.hooks.onDisable(state);
      }
      window.__mods=window.__mods.filter(m=>m.id!==id);
      _previewCache.clear(); renderModCards(); renderStatic();
    };
  });
}

/* ═══════════════════════════════════════════════════════════
   TOWER / MAP CLICK HANDLERS
   ═══════════════════════════════════════════════════════════ */
function selectTowerAtCell(gx,gy){
  // Check multi-cell (size:2) towers first
  const big=state.towers.find(t=>(TOWER_TYPES[t.type]?.size===2)&&towerOccupiesCell(t,gx,gy));
  if(big){state.selectedTowerId=big.id;openOverlay('tower',big.id);renderStatic();return true;}
  const t=state.towers.find(x=>x.x===gx&&x.y===gy);
  if(t){state.selectedTowerId=t.id;openOverlay('tower',t.id);renderStatic();return true;}
  const lc=mapRoutesOf(currentMap())[0].slice(-1)[0];
  if(gx===lc[0]&&gy===lc[1]){ state.selectedTowerId=null; openOverlay('base'); renderStatic(); return true; }
  return false;
}
/* 建造炮台：typeKey 由半圆建造盘传入（不再依赖右侧预选塔种）。
   返回 true 表示建造成功，轮盘据此决定是否收起。 */
function placeTower(gx,gy,typeKey=state.selectedTowerType){
  state.resumePending=false;             // building implies "start from here"
  if(!TOWER_TYPES[typeKey]) typeKey='cannon';
  const ttype=TOWER_TYPES[typeKey];
  const ps=pathSet();
  const foot=ttype.size===2?[[gx,gy],[gx+1,gy],[gx,gy+1],[gx+1,gy+1]]:[[gx,gy]];
  let problem='';
  for(const [cx,cy] of foot){
    if(cx<0||cy<0||cx>=GRID_W||cy>=GRID_H){ problem='超出地图边界'; break; }
    if(ps.has(`${cx},${cy}`)){ problem='这里是敌人路线'; break; }
    if(state.towers.some(t=>towerOccupiesCell(t,cx,cy))){ problem='该位置已有建筑'; break; }
  }
  if(problem){ setMsg(`${ttype.name}无法建造：${problem}。`); return false; }
  if(state.gold<ttype.cost){ setMsg(`${ttype.name}需要 ${ttype.cost} 金，当前只有 ${Math.floor(state.gold)} 金。`); sfx('click'); return false; }
  const t=makeTower(typeKey,gx,gy);
  state.towers.push(t); state.gold-=ttype.cost; t.invested=ttype.cost;
  // 建造完成后不保留“选中”状态：建造盘收起，射程圈也不会一直挂在地图上
  state.selectedTowerId=null; state.towersRev++;
  const c=towerCenterPx(t);
  createParticles(c.x,c.y,18,`rgb(${(ttype.color||[0,240,255]).join(',')})`,1.1);
  state.shake=Math.max(state.shake,2.5); sfx('coin');
  setMsg(`建造了 ${ttype.name}（${ttype.cost} 金）。点按已建炮台可升级/出售。`);
  callHook('onTowerPlace',t);
  invalidateBackground();
  renderStatic();
  scheduleAutoSave();
  return true;
}

/* The stage can change size after the initial measurement (fonts, the sidebar
   growing, a window resize) — resize the canvas backing store to match so the
   board is never stretched or clipped. */
let _fitQueued=false;
function scheduleFit(){
  if(_fitQueued)return;
  _fitQueued=true;
  requestAnimationFrame(()=>{ _fitQueued=false; fitBoard(); });
}
window.addEventListener('resize',scheduleFit);
window.addEventListener('load',()=>fitBoard());
if(typeof ResizeObserver!=='undefined'){
  try{ new ResizeObserver(()=>scheduleFit()).observe(document.getElementById('canvasBox')); }catch(_){}
}
window.addEventListener('keydown',e=>{
  const overlayOpen=state.overlayMode!=='none';
  if(e.code==='Escape'){
    if(state.buildCell){ closeBuildWheel(); return; }
    if(overlayOpen) closeOverlay();
    else if(state.priorityTargetId){ state.priorityTargetId=null; setMsg('已清除优先目标。'); }
    return;
  }
  if(overlayOpen)return;                       // game hotkeys must not fire behind a dialog
  if(e.code==='Space'){ e.preventDefault(); startWave(); }
  else if(e.code==='KeyP'){ if(!state.gameOver){ state.paused=!state.paused; renderStatic(); } }
  else if(e.code==='KeyA'){ document.getElementById('autoWaveBtn')?.click(); }
  else if(e.code==='KeyC'){ openOverlay('codex'); }
  if(state.camera.needsCam&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)){
    e.preventDefault();
    const step=52;
    if(e.code==='ArrowUp')state.camera.y-=step;
    if(e.code==='ArrowDown')state.camera.y+=step;
    if(e.code==='ArrowLeft')state.camera.x-=step;
    if(e.code==='ArrowRight')state.camera.x+=step;
    updateCameraOffset();
  }
});

/* ═══════════════════════════════════════════════════════════
   INPUT — 统一的指针输入，鼠标与触屏通用：
   · 短按 / 点击 = 执行操作（选炮台、集火、弹出建造盘）
   · 拖动 = 平移地图（地图超出屏幕时），松手带一点惯性
   ═══════════════════════════════════════════════════════════ */
let boardDragging=false, boardDragMoved=false, boardDragStart={x:0,y:0,camX:0,camY:0};
let pointerStart=null, lastPan={x:0,y:0,t:0}, dragVel={x:0,y:0};
const TAP_MOVE_PX=12, TAP_MAX_MS=650;
const TOUCH_MOVE_PX=20, TOUCH_MAX_MS=1000;   // 触屏手指会抖、点按也更慢

let _suppressCanvasClickUntil=0;
function handleTap(clientX,clientY,touch){
  if(state.gameOver){ resetGame(state.stageId); return; }
  if(state.overlayMode!=='none')return;
  const rect=canvas.getBoundingClientRect();
  const x=clientX-rect.left,y=clientY-rect.top;
  const bx=x-state.board.x,by=y-state.board.y;
  if(bx<0||by<0||bx>=state.board.w||by>=state.board.h){ closeBuildWheel(); return; }

  // 建造盘打开时，点其它位置只收起轮盘
  if(state.buildCell){ closeBuildWheel(); return; }

  // 点地道入口/出口 → 封堵面板
  const tp=tunnelAt(x,y,touch?2.2:1.35);
  if(tp){ openOverlay('tunnel',tp.id); return; }

  // 点敌方单位 → 设为全炮台优先目标（触屏给更大的判定半径）
  const pad=touch?1.9:1;
  let clickedEnemy=null,bestD=Infinity;
  for(const en of state.enemies){
    if(!en.alive||en.inTunnel)continue;
    const r=((en.radius||(en.boss?26:14))+8)*pad;
    const d=Math.hypot(en.x-x,en.y-y);
    if(d<=r&&d<bestD){clickedEnemy=en;bestD=d;}
  }
  if(clickedEnemy){
    if(clickedEnemy.invincible){
      setMsg('⛏ 掘地兽处于无敌状态，炮塔无法伤到它；它挖穿地道后会自行消失。');
      createParticles(clickedEnemy.x,clickedEnemy.y,12,'#cbd5e1',.9);
      return;
    }
    state.priorityTargetId=clickedEnemy.id;
    setMsg(`🎯 已标记优先目标：${clickedEnemy.boss?(clickedEnemy.icon+' '+clickedEnemy.bossTypeName):(clickedEnemy.name||'敌人')}，所有炮台集火攻击。`);
    createParticles(clickedEnemy.x,clickedEnemy.y,18,'#00f0ff',1.1);
    state.shake=Math.max(state.shake,1.5);
    return;
  }

  const gx=Math.floor(bx/state.board.cell),gy=Math.floor(by/state.board.cell);
  if(gx<0||gy<0||gx>=GRID_W||gy>=GRID_H)return;
  if(selectTowerAtCell(gx,gy)) return;          // 已有炮台 / 基地终点
  if(pathSet().has(`${gx},${gy}`)){ setMsg('这里是敌人路线，无法建造。'); return; }
  openBuildWheel(gx,gy);                        // 空地 → 半圆建造盘
}

canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(e.pointerType!=='mouse') wheelArmAt=Math.max(wheelArmAt,performance.now()+140);
  if(state.overlayMode!=='none')return;
  pointerStart={x:e.clientX,y:e.clientY,t:performance.now(),type:e.pointerType};
  boardDragging=true; boardDragMoved=false;
  boardDragStart={x:e.clientX,y:e.clientY,camX:state.camera.x,camY:state.camera.y};
  state.camera.vx=0; state.camera.vy=0;
  lastPan={x:e.clientX,y:e.clientY,t:performance.now()};
  dragVel={x:0,y:0};
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
});

canvas.addEventListener('pointermove',e=>{
  const rect=canvas.getBoundingClientRect();
  state.mouse.x=e.clientX-rect.left; state.mouse.y=e.clientY-rect.top; state.mouse.inside=true;
  if(!boardDragging)return;
  const dx=e.clientX-boardDragStart.x, dy=e.clientY-boardDragStart.y;
  const moveLimit=pointerStart&&pointerStart.type!=='mouse'?TOUCH_MOVE_PX:TAP_MOVE_PX;
  if(!boardDragMoved&&Math.hypot(dx,dy)>moveLimit) boardDragMoved=true;
  if(boardDragMoved&&state.camera.needsCam){
    const now=performance.now();
    const dt=Math.max(.008,(now-lastPan.t)/1000);
    dragVel={x:-(e.clientX-lastPan.x)/dt,y:-(e.clientY-lastPan.y)/dt};
    lastPan={x:e.clientX,y:e.clientY,t:now};
    state.camera.x=boardDragStart.camX-dx;
    state.camera.y=boardDragStart.camY-dy;
    closeBuildWheel();
    updateCameraOffset();
  }
});

canvas.addEventListener('pointerup',e=>{
  if(!boardDragging)return;
  boardDragging=false;
  const moved=boardDragMoved;
  const elapsed=performance.now()-(pointerStart?pointerStart.t:0);
  if(moved&&state.camera.needsCam){
    const sp=Math.hypot(dragVel.x,dragVel.y);
    if(sp>240){ state.camera.vx=clamp(dragVel.x,-1500,1500); state.camera.vy=clamp(dragVel.y,-1500,1500); }
  }
  boardDragMoved=false; pointerStart=null; dragVel={x:0,y:0};
  // 真正的点击交给原生 click 处理：触屏长按/桥接延迟都不会再吞掉点击，
  // 拖动结束时用 suppress 标记挡住浏览器补发的那一次 click。
  if(moved) _suppressCanvasClickUntil=performance.now()+450;
});

/* 触屏/鼠标统一走 click：不再依赖 pointerdown→pointerup 的时长，
   手指按住超过 1 秒再抬起也能正常建造。 */
canvas.addEventListener('click',e=>{
  if(performance.now()<_suppressCanvasClickUntil) return;
  if(state.overlayMode!=='none') return;
  handleTap(e.clientX,e.clientY,e.pointerType!=='mouse');
});

canvas.addEventListener('pointercancel',()=>{ boardDragging=false; boardDragMoved=false; pointerStart=null; _suppressCanvasClickUntil=performance.now()+450; });
canvas.addEventListener('pointerleave',()=>{ if(!boardDragging){ state.mouse.inside=false; } });
canvas.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(state.buildCell){ closeBuildWheel(); return; }
  if(state.priorityTargetId){ state.priorityTargetId=null; setMsg('已清除优先目标。'); return; }
  if(state.selectedTowerId){ state.selectedTowerId=null; setMsg('已取消选中炮台。'); return; }
  closeOverlay();
});
mapList.addEventListener('click',e=>{const b=e.target.closest('[data-map]');if(!b)return;state.previewMode=false;resetGame(b.dataset.map);});


/* ═══════════════════════════════════════════════════════════
   MOD API — built last, once every piece it references exists.
   Exposed as both the local MOD_API used by loadModFromText(),
   and window.TD for convenience access from inside mod hooks.
   ═══════════════════════════════════════════════════════════ */
MOD_API = {
  version: '2.0',
  TOWER_TYPES, MAPS, BOSS_TYPES, TECHS, ENEMY_TYPES,
  registerTower(modId, id, def){
    if(!id) throw new Error('registerTower: 缺少塔的 id');
    const merged={ name:'未命名塔', cost:100, baseRange:2.5, baseDamage:20, baseFireRate:1,
      projectileSpeed:8, splash:0, slow:0, pierce:0, armorPen:0, color:[255,255,255], desc:'',
      size:1, noUpgrade:false, ...def, __modId:modId };
    TOWER_TYPES[id]=merged;
    return merged;
  },
  registerMap(modId, def){
    if(!def||!def.id) throw new Error('registerMap: 缺少地图 id');
    const exist=MAPS.find(m=>m.id===def.id);
    if(exist){ console.warn(`[MOD] 地图 "${def.id}" 已存在，已跳过注册。`); return exist; }
    const merged={ name:'未命名地图', bossName:'未知Boss', desc:'',
      theme:['#0a0a14','#14182a','#202840'], roadFill:'rgba(120,120,120,.85)', roadEdge:'rgba(170,170,170,.4)',
      grassA:'rgba(14,14,22,.92)', grassB:'rgba(11,11,18,.92)', glow:'rgba(150,150,255,.2)',
      accentColor:'#aaaaaa', deco:'forest', path:[[0,4],[11,4]],
      gridW:12, gridH:9, bossPool:[], hpMul:1,
      waveEnemyCountBase:GAME_BALANCE.wave.countBase, waveEnemyCountGrowth:GAME_BALANCE.wave.countGrowth,
      waveEnemySpeedBase:GAME_BALANCE.wave.speedBase, waveEnemySpeedGrowth:GAME_BALANCE.wave.speedGrowth, waveOverrides:{},
      ...def, __modId:modId };
    MAPS.push(merged);
    _previewCache.clear();
    return merged;
  },
  registerBoss(modId, def){
    if(!def||!def.id) throw new Error('registerBoss: 缺少 Boss id');
    const exist=BOSS_TYPES.find(b=>b.id===def.id);
    if(exist){ console.warn(`[MOD] Boss "${def.id}" 已存在，已跳过注册。`); return exist; }
    const merged={ name:'神秘敌人', color:[255,255,255], hpMul:1, speedMul:1, armor:0,
      summonRate:4, minions:3, rageMinions:5, icon:'👾', doubleReward:false, ...def, __modId:modId };
    BOSS_TYPES.push(merged);
    _previewCache.clear();
    return merged;
  },
  registerEnemyType(modId, def){
    if(!def||!def.id) throw new Error('registerEnemyType: 缺少敌人 id');
    const exist=ENEMY_TYPES.find(e=>e.id===def.id);
    if(exist){ console.warn(`[MOD] 敌人 "${def.id}" 已存在，已跳过注册。`); return exist; }
    const merged={ name:'未知敌人', hpMul:1, speedMul:1, radius:14, color:[255,140,120],
      armor:0, rewardMul:1, dmgMul:1, unlock:1, weight:5, slowResist:0, icon:'', ...def, __modId:modId };
    ENEMY_TYPES.push(merged);
    _previewCache.clear();
    return merged;
  },
  registerTech(modId, def){
    if(!def||!def.id) throw new Error('registerTech: 缺少科技 id');
    const exist=TECHS.find(t=>t.id===def.id);
    if(exist){ console.warn(`[MOD] 科技 "${def.id}" 已存在，已跳过注册。`); return exist; }
    const merged={ name:'未命名科技', icon:'⬡', x:500, y:1100, req:[], max:999, base:2,
      desc:'', eff:lv=>`Lv.${lv}`, ...def, __modId:modId };
    TECHS.push(merged);
    return merged;
  },
  get state(){ return state; },
  writeAutoSave, readAutoSave, applySave, normalizeCodex, scheduleAutoSave,
  utils:{ uid, clamp, dist, cellCenter, towerCenterPx, towerFootprint, createParticles,
    floatingText, sfx, makeTower, makeEnemy, currentMap, pathPoints, basePosition, rotateTowards,
    getPathData, pointAtDistance, syncEnemyPosition, aliveEnemies, damageEnemy, applySlow,
    effectiveStats, baseEffectiveStats, towerUpgradeCost, towerSellValue, buildWave, previewWave },
  refreshUI(){ invalidateBackground(); renderStatic(); },
};
window.TD = MOD_API;

/* ═══════════════════════════════════════════════════════════
   EDITOR PREVIEW — 地图编辑器点「在游戏中试玩」会通过
   localStorage 传一张地图 + 打开 index.html?fromeditor=1
   这里把它注册成临时模组并直接开局，不会写入自动存档。
   ═══════════════════════════════════════════════════════════ */
function loadEditorPreview(){
  try{
    const params=new URLSearchParams(location.search||'');
    if(!params.has('fromeditor')) return null;
    const raw=localStorage.getItem('starocean_editor_pending_map');
    if(!raw) return null;
    const data=JSON.parse(raw);
    const mapDef=data&&data.mapDef;
    const hasPath=(Array.isArray(mapDef&&mapDef.path)&&mapDef.path.length>=2)||(Array.isArray(mapDef&&mapDef.paths)&&mapDef.paths.some(p=>Array.isArray(p)&&p.length>=2));
    if(!mapDef||!mapDef.id||!hasPath) return null;
    let mapId=String(mapDef.id);
    if(MAPS.some(m=>m.id===mapId)) mapId=mapId+'_preview';
    mapDef.id=mapId;
    const bossDef=data.bossDef||null;
    const mod={
      id:'editor_preview', name:'编辑器预览地图（临时）',
      register(api,modId){
        if(bossDef){ bossDef.id=mapId+'_boss'; api.registerBoss(modId,bossDef); mapDef.bossPool=[bossDef.id]; }
        api.registerMap(modId,mapDef);
      }
    };
    window.__mods=window.__mods.filter(m=>m.id!=='editor_preview');
    window.__mods.push(mod);
    state.activeMods.add('editor_preview');
    state.previewMode=true;
    mod.register(MOD_API,'editor_preview');
    return mapId;
  }catch(e){ console.warn('[EDITOR PREVIEW]',e); return null; }
}
const __editorMapId=loadEditorPreview();

/* ── INIT ── */
applyMapGrid();
fitBoard();
renderStatic();
if(__editorMapId){
  const prevAuto=state.autoSave;
  state.autoSave=false;              // 试玩不覆盖玩家自己的自动存档
  resetGame(__editorMapId);
  state.autoSave=prevAuto;
  setMsg(`已从编辑器载入《${currentMap().name}》${GRID_W}×${GRID_H}，直接点「开始下一波」试玩（试玩不覆盖自动存档）。`);
} else {
  maybeOfferAutoSave();              // offer the rolling localStorage snapshot, if any
}
refreshSaveHistoryBtn();
requestAnimationFrame(loop);

})();
