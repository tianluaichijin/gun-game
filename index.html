<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>星海防线 · 网页版塔防</title>
  <style>
    :root{
      --bg1:#07111d;--bg2:#0b1730;--bg3:#132442;
      --panel:rgba(10,18,32,.90);--line:rgba(255,255,255,.10);
      --text:#eef6ff;--muted:#9cb0c9;
      --cyan:#6ee7ff;--violet:#b38cff;--amber:#ffd07a;--rose:#ff889f;--green:#7dffbb;--orange:#ffb366;
      --shadow:0 18px 55px rgba(0,0,0,.38);--radius:22px;--sideW:360px;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;overflow:hidden;background:#040814;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
    body{background:radial-gradient(1200px 900px at 20% 15%,rgba(98,197,255,.12),transparent 55%),
         radial-gradient(900px 700px at 85% 12%,rgba(193,112,255,.10),transparent 52%),
         linear-gradient(135deg,var(--bg1),var(--bg2) 48%,var(--bg3))}
    #app{width:100vw;height:100vh;display:grid;grid-template-columns:minmax(0,1fr) var(--sideW);gap:14px;padding:14px}
    #gameWrap{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
    /* 注意：不要在画布上方使用 backdrop-filter。它会让浏览器每帧重算整块背景模糊，
       实测能把帧率从 48fps 压到 5fps，是卡顿的头号元凶。 */
    .panel,.topbar{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius)}
    .topbar{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .title{font-size:clamp(16px,1.6vw,22px);font-weight:800;letter-spacing:.2px}
    .sub{color:var(--muted);font-size:12px;margin-top:2px}
    .statRow{display:flex;gap:8px;flex-wrap:wrap}
    .stat{min-width:82px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);transition:background .3s,border-color .3s}
    .stat small{display:block;font-size:11px;color:var(--muted)}
    .stat b{display:block;font-size:19px;margin-top:1px;transform-origin:left center}
    @keyframes statPopUp{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
    @keyframes statPopDown{0%{transform:scale(1)}35%{transform:scale(1.15)}100%{transform:scale(1)}}
    .statPopUp{animation:statPopUp .38s cubic-bezier(.34,1.56,.64,1)}
    .statPopDown{animation:statPopDown .38s cubic-bezier(.34,1.56,.64,1)}
    .btnRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    button,input{font:inherit;cursor:pointer;border:0;outline:none}
    .btn{padding:9px 13px;border-radius:13px;background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.10);transition:.16s;display:inline-flex;align-items:center;gap:7px;font-size:14px}
    .btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.13)}
    a.btn{text-decoration:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
    .btn:active{transform:translateY(0) scale(.96);transition:.06s}
    .btn.primary{background:linear-gradient(135deg,#6ee7ff,#7dffbb);color:#02131d;font-weight:800}
    .btn.danger{background:linear-gradient(135deg,#ff7f9c,#ffad76);color:#22070f;font-weight:800}
    .btn.small{padding:7px 10px;border-radius:11px;font-size:13px}
    .btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
    #stageCard{position:relative;flex:1;min-height:0;padding:12px}
    #canvasBox{position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.10)}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #bgCanvas{position:absolute;left:0;top:0;z-index:0;pointer-events:none}
    #gameCanvas{position:relative;z-index:1;background:transparent}
    button{touch-action:manipulation}
    .chips{position:absolute;left:14px;bottom:14px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
    .gameMiniMap{position:absolute;z-index:9;border-radius:12px;overflow:hidden;background:rgba(6,10,18,.72);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 30px rgba(0,0,0,.45)}
    .miniHeader{cursor:move;font-size:10.5px;padding:5px 8px;background:rgba(255,255,255,.08);color:#cfe9ff;user-select:none;white-space:nowrap}
    #miniMapCanvas{display:block;cursor:crosshair}
    .miniResizeHandle{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.35) 50%)}
    .chip{padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.12);font-size:12px;color:#edf5ff}

    /* ── Wave banner + wave panel ── */
    .waveBanner{position:absolute;left:50%;top:16%;transform:translate(-50%,-10px) scale(.96);z-index:8;padding:10px 24px;border-radius:16px;
      background:rgba(6,12,22,.78);border:1px solid rgba(110,231,255,.35);box-shadow:0 14px 44px rgba(0,0,0,.5);
      font-weight:800;font-size:clamp(15px,1.9vw,23px);letter-spacing:1px;color:#eaf7ff;opacity:0;pointer-events:none;
      transition:opacity .25s ease,transform .25s cubic-bezier(.16,1,.3,1);white-space:nowrap}
    .waveBanner.show{opacity:1;transform:translate(-50%,0) scale(1)}
    .waveBanner.boss{color:#ffd36b;border-color:rgba(255,150,80,.55);text-shadow:0 0 20px rgba(255,120,40,.55);background:rgba(28,10,4,.8)}
    .waveComp{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
    .waveChip{padding:3px 8px;border-radius:999px;font-size:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#dbe9f7;white-space:nowrap}
    .waveChip.boss{background:rgba(255,140,60,.16);border-color:rgba(255,140,60,.38);color:#ffcf9a}
    .waveChip.heavy{background:rgba(196,132,252,.14);border-color:rgba(196,132,252,.3);color:#e3ccff}
    #waveProgress{transition:width .18s linear}

    /* ── Sidebar ── */
    #side{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;padding-right:1px;padding-bottom:4px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
    #side::-webkit-scrollbar{width:4px}
    #side::-webkit-scrollbar-track{background:transparent}
    #side::-webkit-scrollbar-thumb{background:rgba(110,231,255,.22);border-radius:999px}
    #side::-webkit-scrollbar-thumb:hover{background:rgba(110,231,255,.42)}
    .panel{padding:13px}
    .panel h3{font-size:16px;font-weight:700;margin-bottom:9px}
    .muted{color:var(--muted);font-size:13px;line-height:1.55}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .cardMini{padding:10px 11px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
    .cardMini .k{font-size:11px;color:var(--muted)}
    .cardMini .v{font-size:20px;font-weight:800;margin-top:2px}
    .section{display:flex;flex-direction:column;gap:9px}
    .towerBtn,.mapBtn{width:100%;text-align:left;padding:11px 12px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:var(--text);transition:.15s}
    .towerBtn:hover,.mapBtn:hover{transform:translateY(-1px);background:rgba(255,255,255,.10)}
    .active{background:rgba(110,231,255,.12)!important;border-color:rgba(110,231,255,.34)!important}
    .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .tag{padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11px;color:#f5fbff;white-space:nowrap}
    .footerTip{color:var(--muted);font-size:12px;line-height:1.6;margin-top:4px}
    .progress{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
    .progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:inherit;transition:width .3s}
    .notice{padding:10px 13px;border-radius:16px;background:linear-gradient(135deg,rgba(110,231,255,.14),rgba(179,140,255,.12));border:1px solid rgba(255,255,255,.10);line-height:1.6;font-size:13px;transition:border-color .3s}
    @keyframes msgFlash{0%{border-color:rgba(110,231,255,.7);background:linear-gradient(135deg,rgba(110,231,255,.28),rgba(179,140,255,.22))}100%{border-color:rgba(255,255,255,.10);background:linear-gradient(135deg,rgba(110,231,255,.14),rgba(179,140,255,.12))}}
    .msgFlash{animation:msgFlash .6s ease}

    /* ── Base HP bar in sidebar ── */
    .baseBar{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
    .baseBarFill{height:100%;border-radius:inherit;transition:width .4s}

    /* ── Overlay ── */
    #overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,10,18,0);opacity:0;pointer-events:none;transition:opacity .22s ease,background-color .22s ease}
    #overlay.show{opacity:1;pointer-events:auto;background:rgba(5,10,18,.62)}
    .overlayCard{width:min(1100px,100%);max-height:min(92vh,1000px);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:26px;background:rgba(8,16,28,.94);border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 100px rgba(0,0,0,.55);transform:scale(.94) translateY(14px);opacity:0;transition:transform .28s cubic-bezier(.16,1,.3,1),opacity .22s ease}
    #overlay.show .overlayCard{transform:scale(1) translateY(0);opacity:1}
    .overlayCard::-webkit-scrollbar{width:4px}
    .overlayCard::-webkit-scrollbar-track{background:transparent}
    .overlayCard::-webkit-scrollbar-thumb{background:rgba(110,231,255,.22);border-radius:999px}
    .overlayCard::-webkit-scrollbar-thumb:hover{background:rgba(110,231,255,.42)}
    .overlayHead{position:sticky;top:0;background:linear-gradient(180deg,rgba(8,16,28,.95),rgba(8,16,28,.70));border-bottom:1px solid rgba(255,255,255,.10);padding:13px 15px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:1;border-radius:26px 26px 0 0}
    .overlayBody{padding:15px}
    .overlayGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    @media(max-width:760px){.overlayGrid{grid-template-columns:1fr}}
    .bigCard{padding:15px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10)}
    .techWrap{position:relative;border-radius:22px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:radial-gradient(ellipse at 50% 0%,rgba(110,231,255,.07),transparent 60%),rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08)}
    .techSkillBadgeLayer{position:sticky;top:10px;left:10px;height:0;z-index:6;pointer-events:none}
    .techSkillBadge{display:inline-block;pointer-events:auto;padding:7px 13px;border-radius:999px;background:rgba(8,16,28,.86);border:1px solid rgba(110,231,255,.35);box-shadow:0 8px 22px rgba(0,0,0,.4);font-size:12.5px;color:#d8f8ff;white-space:nowrap}
    .techSkillBadge b{color:var(--cyan);font-size:14px}
    .techWrap::-webkit-scrollbar{width:4px;height:4px}
    .techWrap::-webkit-scrollbar-track{background:transparent}
    .techWrap::-webkit-scrollbar-thumb{background:rgba(110,231,255,.22);border-radius:999px}
    .techWrap::-webkit-scrollbar-thumb:hover{background:rgba(110,231,255,.42)}
    .techInner{position:relative}
    .techSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .techNode{position:absolute;width:150px;transform:translate(-50%,-50%);padding:10px 11px;border-radius:16px;background:rgba(12,20,34,.82);border:1px solid rgba(255,255,255,.14);color:var(--text);text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:.15s}
    .techNode:hover{background:rgba(255,255,255,.10);transform:translate(-50%,-50%) translateY(-2px)}
    .techNode.maxed{border-color:rgba(125,255,187,.5);box-shadow:0 0 0 1px rgba(125,255,187,.15) inset,0 6px 20px rgba(0,0,0,.3)}
    .techNode.root{border-color:rgba(255,208,122,.55)}
    @keyframes techPulse{0%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 0 0 rgba(125,255,187,.55),0 6px 20px rgba(0,0,0,.3)}40%{transform:translate(-50%,-50%) scale(1.08);box-shadow:0 0 0 14px rgba(125,255,187,0),0 6px 20px rgba(0,0,0,.3)}100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 0 0 rgba(125,255,187,0),0 6px 20px rgba(0,0,0,.3)}}
    .techNode.techPulse{animation:techPulse .55s ease-out}
    .techNode .t{display:flex;justify-content:space-between;gap:7px;align-items:center;font-weight:700;font-size:13px}
    .techNode .d{margin-top:4px;font-size:10.5px;color:var(--muted);line-height:1.4}
    .techNode .c{margin-top:6px;font-size:10.5px;color:#d8f8ff}
    .techNode .ic{font-size:14px;margin-right:3px}
    .locked{opacity:.4;filter:grayscale(.4)}

    /* ── Mod overlay ── */
    .modDropZone{border:2px dashed rgba(110,231,255,.32);border-radius:20px;padding:34px 20px;text-align:center;color:var(--muted);cursor:pointer;transition:.2s;background:rgba(110,231,255,.04);position:relative}
    .modDropZone:hover,.modDropZone.drag{border-color:var(--cyan);background:rgba(110,231,255,.10);color:var(--text)}
    .modDropZone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
    .modCard{padding:13px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .modCard.modOn{background:rgba(110,231,255,.08);border-color:rgba(110,231,255,.26)}
    .modInfo{flex:1;min-width:0}
    .modName{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .modBadge{font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted)}
    .modBadge.on{background:rgba(110,231,255,.20);color:var(--cyan)}
    .modDesc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
    .modMeta{font-size:11px;color:rgba(255,255,255,.3);margin-top:4px}
    .modToggle{padding:8px 13px;border-radius:12px;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:var(--text);cursor:pointer;white-space:nowrap;transition:.14s;flex-shrink:0}
    .modToggle:hover{background:rgba(255,255,255,.13)}
    .modToggle.on{background:linear-gradient(135deg,rgba(110,231,255,.28),rgba(125,255,187,.18));border-color:rgba(110,231,255,.36);color:var(--cyan)}
    .modRemove{padding:6px 10px;border-radius:10px;font-size:12px;border:1px solid rgba(255,80,80,.2);background:rgba(255,80,80,.07);color:var(--rose);cursor:pointer;margin-top:6px;transition:.14s}
    .modRemove:hover{background:rgba(255,80,80,.15)}

    /* ── Monster codex ── */
    .codexCard{padding:13px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);display:flex;flex-direction:column}
    .codexCard.boss{background:linear-gradient(180deg,rgba(255,150,70,.09),rgba(255,255,255,.04));border-color:rgba(255,160,80,.30)}
    .codexHead{display:flex;align-items:center;gap:8px;font-size:15px;flex-wrap:wrap}
    .codexHead strong{font-size:15px}
    .codexDot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.5)}
    .codexStats{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:9px;font-size:11.5px;color:var(--muted)}
    .codexStats b{color:#eaf6ff;font-weight:700}
    .codexDesc{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.65}
    .codexCounter{margin-top:auto;padding-top:8px;font-size:11.5px;color:#c4ebff;line-height:1.55}
    .codexCounter:before{content:'▸ ';color:var(--cyan)}
    .codexKills{font-size:11px;color:rgba(255,255,255,.38);margin-top:5px}
    .resumeHero{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(110,231,255,.12),rgba(179,140,255,.10));border:1px solid rgba(110,231,255,.22);margin-bottom:12px}
    .resumeHero .ic{font-size:30px}
    .resumeHero b{font-size:16px}

    /* ── Build wheel（点击空地弹出的半圆建造盘） ── */
    .buildWheel{position:absolute;left:0;top:0;width:0;height:0;z-index:14;opacity:0;pointer-events:none;transition:opacity .16s ease}
    .buildWheel.show{opacity:1;pointer-events:auto}
    .wheelDisc{position:absolute;border-radius:50%;pointer-events:auto;
      background:radial-gradient(circle at 50% 50%,rgba(6,14,26,.94) 0%,rgba(8,18,32,.82) 52%,rgba(10,22,38,.42) 72%,rgba(10,22,38,0) 100%);
      border:1px solid rgba(110,231,255,.22);box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05) inset;
      }
    .wheelDisc.up{clip-path:inset(0 0 50% 0)}
    .wheelDisc.down{clip-path:inset(50% 0 0 0)}
    .wheelArc{position:absolute;border-radius:50%;pointer-events:none;border:1px dashed rgba(110,231,255,.24)}
    .wheelArc.up{clip-path:inset(0 0 50% 0)}
    .wheelArc.down{clip-path:inset(50% 0 0 0)}
    @keyframes wheelPop{0%{transform:translate(-50%,-50%) scale(.55);opacity:.2}70%{transform:translate(-50%,-50%) scale(1.06);opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
    .wheelItem{position:absolute;width:58px;height:58px;border-radius:50%;transform:translate(-50%,-50%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;
      background:rgba(8,17,30,.92);border:1.6px solid rgba(255,255,255,.18);color:var(--text);
      box-shadow:0 8px 24px rgba(0,0,0,.5);animation:wheelPop .18s cubic-bezier(.34,1.56,.64,1) both;
      transition:transform .1s ease,background .1s ease,box-shadow .1s ease}
    .wheelItem:active{transform:translate(-50%,-50%) scale(.9)}
    .wheelItem.poor{opacity:.42}
    .wheelItem .wiIcon{font-size:19px;line-height:1.05}
    .wheelItem .wiName{font-size:10.5px;font-weight:800;line-height:1.15;letter-spacing:.2px}
    .wheelItem .wiCost{font-size:10px;line-height:1.1;color:var(--amber)}
    .wheelItem.poor .wiCost{color:var(--rose);text-decoration:line-through}
    .wheelClose{position:absolute;width:38px;height:38px;border-radius:50%;transform:translate(-50%,-50%);
      background:rgba(8,15,26,.94);border:1px solid rgba(255,255,255,.22);color:#cfe9ff;font-size:16px;
      display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
    .wheelClose:active{transform:translate(-50%,-50%) scale(.9)}
    .wheelHint{position:absolute;left:50%;transform:translate(-50%,0);top:26px;white-space:nowrap;font-size:11px;
      color:rgba(213,238,255,.72);pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.7)}

    /* ── Tower info cards（右侧炮种说明，不再可点选） ── */
    .towerCard{padding:11px 12px;border-radius:16px;display:flex;gap:10px;align-items:flex-start;
      background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}
    .towerCard .ti{width:36px;height:36px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;
      font-size:19px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
    .towerCard .tbody{flex:1;min-width:0}
    .towerCard .row{align-items:center}
    .towerCard .foot{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}

    .sideToggle{display:none}
    .sideScrim{display:none}

    /* ── Small-screen drawer for the sidebar ── */
    @media(max-width:1100px){
      #app{grid-template-columns:minmax(0,1fr)}
      .sideToggle{display:inline-flex}
      #side{display:none;position:fixed;right:8px;top:66px;bottom:8px;width:min(92vw,380px);z-index:41;
        padding:10px;border-radius:20px;background:rgba(6,12,22,.92);border:1px solid var(--line);
        box-shadow:0 24px 70px rgba(0,0,0,.6)}
      #app.sideOpen #side{display:flex}
      #app.sideOpen .sideScrim{display:block;position:fixed;inset:0;z-index:40;background:rgba(3,8,14,.45)}
    }
    @media (pointer:coarse){
      .btn{padding:11px 15px;min-height:44px}
      .btn.small{min-height:40px}
      .towerBtn,.mapBtn{min-height:44px}
      .chips .chip{font-size:11px;padding:6px 9px}
      .wheelItem{width:62px;height:62px}
      .wheelItem .wiIcon{font-size:21px}
      .wheelItem .wiName{font-size:11.5px}
      .wheelClose{width:44px;height:44px}
    }
    @media(max-width:760px){

window.__mods = [];      // loaded mod objects
window.__modErrors = []; // load error log
let MOD_API = null;      // built once all game data/functions exist — see bottom of script

function callHook(hookName, ...args) {
  for (const mod of window.__mods) {
    if (!state.activeMods.has(mod.id)) continue;
    const fn = mod.hooks?.[hookName];
    if (typeof fn === 'function') {
      try { fn(state, ...args); }
      catch(e) { console.warn(`[MOD:${mod.id}] ${hookName}:`, e); }
    }
  }
}

function loadModFromText(filename, text) {
  try {
    // Mod file must evaluate to an object literal: ({id:'...', name:'...', hooks:{...}, register(api,modId){...}})
    const mod = new Function('"use strict"; return (' + text + ')')();
    if (!mod || typeof mod !== 'object') throw new Error('模组文件需要返回一个对象');
    if (!mod.id) throw new Error('模组缺少 id 字段');
    if (!mod.name) throw new Error('模组缺少 name 字段');
    mod._filename = filename;
    const existing = window.__mods.findIndex(m => m.id === mod.id);
    if (existing >= 0) window.__mods[existing] = mod;
    else window.__mods.push(mod);
    // Content registration (towers/maps/bosses/techs) runs once at load time, regardless of active state
    if (typeof mod.register === 'function') {
      try { mod.register(MOD_API, mod.id); }
      catch(e) { console.warn(`[MOD:${mod.id}] register() error:`, e); window.__modErrors.push({filename,error:`register() 失败: ${e.message}`}); }
    }
    // auto-fire onEnable if already active
    if (state.activeMods.has(mod.id) && typeof mod.hooks?.onEnable === 'function') {
      mod.hooks.onEnable(state);
    }
    return { ok: true, mod };
  } catch(e) {
    window.__modErrors.push({ filename, error: e.message });
    return { ok: false, err: e.message };
  }

const uid = () => Math.random().toString(36).slice(2)+Date.now().toString(36);
const clamp = (n,a,b) => Math.max(a,Math.min(b,n));
const currentMap = () => MAPS.find(m=>m.id===state.stageId)||MAPS[0];

/* ── Path geometry ──
   一张地图可以有多条路线（mp.paths = [routeA, routeB, ...]，每条都是 [x,y] 格子数组），
   所有路线终点必须是同一个基地格。老地图只有 mp.path，会自动当作单路线处理。
   几何缓存在“格”单位里，敌人只存已走路程 d，所以缩放/拖动镜头都不会丢位置。 */
let _routeCache={ id:null, routes:[] };
function mapRoutesOf(mp){
  const list=Array.isArray(mp.paths)?mp.paths.filter(p=>Array.isArray(p)&&p.length>1):null;
  if(list&&list.length) return list;
  return [mp.path||[[0,4],[11,4]]];
}
function getRoutes(){
  const mp=currentMap();
  if(_routeCache.id!==mp.id){
    const routes=mapRoutesOf(mp).map((cells,idx)=>{
      const pts=cells.map(([x,y])=>({x:x+.5,y:y+.5}));
      const cum=[0]; let len=0;
      for(let i=1;i<pts.length;i++){
        len+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
        cum.push(len);
      }
      return { id:idx, cells, pts, cum, len:Math.max(len,.001) };
    });
    _routeCache={ id:mp.id, routes };
  }
  return _routeCache.routes;
}
function routeCount(){ return getRoutes().length; }
function getPathData(route=0){
  const routes=getRoutes();
  return routes[clamp(route|0,0,routes.length-1)];
}
/* Point at `d` cells along a route, plus the segment index and t within it. */
function pointAtDistance(d,route=0){
  const pd=getPathData(route); const {pts,cum}=pd;
  d=clamp(d,0,pd.len);
  let lo=1,hi=cum.length-1;
  while(lo<hi){ const mid=(lo+hi)>>1; if(cum[mid]<d) lo=mid+1; else hi=mid; }
  const i=Math.max(1,lo);
  const segLen=Math.max(cum[i]-cum[i-1],1e-6);
  const t=clamp((d-cum[i-1])/segLen,0,1);
  const a=pts[i-1], b=pts[i];
  return { x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t, i, t };
}

let _pathPxCache=new Map();
function pathPoints(route=0){
  const pd=getPathData(route); const b=state.board;
  const key=pd.id+'|'+currentMap().id+'|'+b.x+'|'+b.y+'|'+b.cell;
  const hit=_pathPxCache.get(route);
  if(!hit||hit.key!==key){
    const val={ key, pts:pd.pts.map(p=>({x:b.x+p.x*b.cell,y:b.y+p.y*b.cell})) };
    _pathPxCache.set(route,val);
    return val.pts;
  }
  return hit.pts;
}
function allRoutePointsPx(){
  return getRoutes().map((r,i)=>pathPoints(i));
}
function invalidatePathPixelCache(){ _pathPxCache.clear(); }

let _pathSetCache={ id:'', set:null };
function pathSet(){
  const id=currentMap().id;
  if(_pathSetCache.id!==id){
    const set=new Set();
    for(const route of mapRoutesOf(currentMap())) for(const [x,y] of route) set.add(`${x},${y}`);
    _pathSetCache={ id, set };
  }
  return _pathSetCache.set;
}
const cellCenter = (x,y) => ({ x:state.board.x+x*state.board.cell+state.board.cell/2, y:state.board.y+y*state.board.cell+state.board.cell/2 });
// pointAtDistance 返回的坐标已经带 +0.5（格中心），不能再套 cellCenter，否则会整体偏半格
const pathPointToPx = (x,y) => ({ x:state.board.x+x*state.board.cell, y:state.board.y+y*state.board.cell });
const dist = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);

/* Deterministic per-wave RNG (same plan for preview + actual spawning). */
function rngFrom(seed){
  let s=seed>>>0;
  return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
}

function ensureAudio(){

const SFX_MIN_GAP={shoot:.035,hit:.03,kill:.045,coin:.05,upgrade:.06,boss:.2,wave:.2,base_hit:.08,superLaser:.15,click:.03};
function sfx(kind='click'){
  if(!state.soundOn)return; const ac=ensureAudio(); if(!ac)return;
  const now=ac.currentTime;
  const gap=SFX_MIN_GAP[kind]??.03;
  const last=state.sfxLast[kind]||-Infinity;
  if(now-last<gap)return; // avoid overlapping bursts turning into distorted noise
  state.sfxLast[kind]=now;
  const tone=(freq,type='sine',dur=.08,gain=.06,sweep=0)=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(freq,now); if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+sweep),now+dur); g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(gain,now+.01); g.gain.exponentialRampToValueAtTime(.0001,now+dur); o.connect(g).connect(ac.destination); o.start(now); o.stop(now+dur+.03); };
  if(kind==='shoot') tone(520,'triangle',.05,.05,120);
  else if(kind==='hit') tone(160,'square',.05,.05,-40);
  else if(kind==='kill'){ tone(220,'sawtooth',.12,.08,320); tone(440,'triangle',.08,.04,180); }
  else if(kind==='boss'){ tone(92,'sawtooth',.28,.11,25); tone(58,'square',.36,.08,12); }
  else if(kind==='wave'){ tone(330,'triangle',.08,.06,90); tone(660,'triangle',.11,.05,180); }
  else if(kind==='upgrade'){ tone(440,'triangle',.08,.05,120); tone(880,'triangle',.07,.04,220); }
  else if(kind==='coin'){ tone(880,'sine',.05,.05,160); tone(1200,'sine',.06,.04,140); }
  else if(kind==='base_hit'){ tone(80,'square',.15,.10,-20); }
  else if(kind==='superLaser'){ tone(120,'sawtooth',.22,.13,-60); tone(440,'sine',.28,.08,300); tone(1200,'triangle',.18,.05,500); }
  else tone(420,'sine',.05,.03,40);
}

function skillCost(lv,base){ return base+Math.floor(lv*.7); }

function makeTower(type,x,y){

// Generic multi-cell footprint support (driven by TOWER_TYPES[type].size)
function towerFootprint(t){

  if(sz===2) return [[t.x,t.y],[t.x+1,t.y],[t.x,t.y+1],[t.x+1,t.y+1]];
  return [[t.x,t.y]];

// Center pixel of a tower (accounts for multi-cell footprint)
function towerCenterPx(t){
  const sz=TOWER_TYPES[t.type]?.size||1;
  if(sz===2) return { x:state.board.x+(t.x+1)*state.board.cell, y:state.board.y+(t.y+1)*state.board.cell };
  return cellCenter(t.x,t.y);
}
// Rotate `current` angle towards `target` angle by at most `maxDelta` radians (shortest path)
function rotateTowards(current,target,maxDelta){
  let diff=((target-current+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
  if(Math.abs(diff)<=maxDelta) return target;
  return current+Math.sign(diff)*maxDelta;
}
const ROT_SPEED=11; // radians/sec — how fast tower barrels track targets
const SUPERLASER_COOLDOWN=2.0; // seconds between superLaser shots (used for charge-bar math too)

const TOWER_SPAWN_ANIM_MS=280; // how long the "pop-in" scale animation takes after placement
// Overshoot ease (classic UI "pop") — 0→1 input, briefly exceeds 1 near the end.
function easeOutBack(t){ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
// Current draw-time scale for a tower's spawn-in animation (1 once it's finished).
function towerSpawnScale(t){
  const age=performance.now()-(t.spawnAt||0);
  if(age>=TOWER_SPAWN_ANIM_MS)return 1;
  return Math.max(0,easeOutBack(clamp(age/TOWER_SPAWN_ANIM_MS,0,1)));
}

function availableBossTypes(){
  const base=BOSS_TYPES.filter(b=>!b.__modId||state.activeMods.has(b.__modId));
  const mp=currentMap();
  if(mp.bossPool&&mp.bossPool.length){
    const filtered=base.filter(b=>mp.bossPool.includes(b.id));
    if(filtered.length) return filtered;
  }
  return base;
}
function getBossType(wave){
  const pool=availableBossTypes();
  if(pool.length===0) return BOSS_TYPES[0];
  const idx=Math.floor(Math.max(0,wave/5-1))%pool.length;
  return pool[Math.max(0,idx)];
}

/* Per-wave normal-enemy count & base speed (speed is in CELLS per second).
   Maps may define waveEnemyCountBase/Growth and waveEnemySpeedBase/Growth,
   plus an optional waveOverrides map keyed by wave number. */
function waveEnemyParams(wave){
  const mp=currentMap(); const wb=GAME_BALANCE.wave;
  const cBase=mp.waveEnemyCountBase??wb.countBase, cGrow=mp.waveEnemyCountGrowth??wb.countGrowth;
  const sBase=mp.waveEnemySpeedBase??wb.speedBase, sGrow=mp.waveEnemySpeedGrowth??wb.speedGrowth;
  const ov=mp.waveOverrides&&mp.waveOverrides[wave];
  const count=(ov&&ov.count!=null)?Math.max(1,Math.round(ov.count)):Math.floor(cBase+wave*cGrow);
  const speed=(ov&&ov.speed!=null)?Math.max(.05,ov.speed):Math.min(wb.speedCap,sBase+wave*sGrow);
  return {count,speed};
}

/* ── Wave planner ──
   Deterministic for (map, wave) so the sidebar preview always matches what
   actually spawns. `delay` is the pause BEFORE that entry spawns. */
function buildWave(wave){
  const mp=currentMap();
  const params=waveEnemyParams(wave);
  const total=clamp(Math.round(params.count),1,GAME_BALANCE.wave.maxCount);
  const seed=(((mp.id.charCodeAt(0)||7)*2654435761) ^ (wave*40503) ^ (mapRoutesOf(mp).length*7919))>>>0;
  const rnd=rngFrom(seed);
  const pool=ENEMY_TYPES.filter(t=>wave>=(t.unlock||1)&&t.weight>0&&!t.mechanic);
  const poolW=pool.reduce((a,t)=>a+(t.weight||1),0);
  const entries=[];
  const gap=clamp(.58-wave*.008,.22,.58);
  const rc=Math.max(1,routeCount());
  for(let i=0;i<total;i++){
    let r=rnd()*poolW, pick=pool[0];
    for(const t of pool){ r-=(t.weight||1); if(r<=0){ pick=t; break; } }
    entries.push({ typeId:pick.id, boss:false, bossType:null, route:i%rc, delay:i===0?.35:gap*(.72+rnd()*.56) });
  }
  let boss=null;
  if(wave%5===0){
    const bt=getBossType(wave);
    if(bt){
      boss=bt;
      const at=clamp(Math.floor(entries.length*.45),1,Math.max(1,entries.length-1));
      const broute=at%rc;
      entries.splice(at,0,{ typeId:'grunt', boss:true, bossType:bt, route:broute, delay:1.2 });
      const escorts=2+Math.floor(wave/10);
      const escType=wave>=9?'shield':wave>=6?'brute':'grunt';
      for(let i=0;i<escorts;i++){
        entries.splice(at+1+i,0,{ typeId:escType, boss:false, bossType:null, route:broute, delay:i===0?.35:.45 });
      }
    }
  }
  // 每 8 波：每条还没有地道的路线各追加一只掘地兽（不计入普通权重池）
  if(wave%8===0){
    for(let r=0;r<rc;r++){
      if(state.tunnels.some(t=>t.route===r)) continue;
      const at=clamp(Math.floor(entries.length*(.30+r*.12)),1,entries.length);
      entries.splice(at,0,{ typeId:'digger', boss:false, bossType:null, digger:true, route:r, delay:1.1+r*.18 });
    }
  }
  const counts={};
  for(const e of entries){
    const key=e.boss?('boss:'+e.bossType.id):e.typeId;
    counts[key]=(counts[key]||0)+1;
  }
  return { wave, total:entries.length, boss, counts, entries };
}
const _previewCache=new Map();
function previewWave(wave){
  const key=state.stageId+'|'+wave;
  if(!_previewCache.has(key)) _previewCache.set(key,buildWave(wave));
  return _previewCache.get(key);
}

/* Shared stat formulas — used by spawning AND by the codex, so the numbers
   shown in the bestiary always match what actually spawns. */
function normalEnemyStats(type,wave){
  const wb=GAME_BALANCE.wave;
  return {
    hp:Math.round((wb.hpBase+wave*wb.hpLinear+wave*wave*wb.hpQuad)*(type.hpMul||1)*mapEnemyHpMul()),
    speed:clamp(waveEnemyParams(wave).speed,.08,wb.speedCap*1.2)*(type.speedMul||1),
    armor:type.armor||0,
    baseDamage:Math.round((5+wave*.7)*(type.dmgMul||1)),
    reward:Math.round((9+wave*1.85)*(type.rewardMul||1)),
  };
}
function bossEnemyStats(bt,wave){
  return {
    hp:Math.round((720+wave*195)*(bt.hpMul||1)*mapEnemyHpMul()),
    speed:clamp(waveEnemyParams(wave).speed,.08,GAME_BALANCE.wave.speedCap*1.2)*(bt.speedMul||1),
    armor:Math.min(.55,(bt.armor||0)+wave*.003),
    baseDamage:Math.round((42+wave*3.2)*(bt.dmgMul||1)),
    reward:Math.round((14+wave*2.2)*8*(bt.doubleReward?2:1)),
  };
}

function makeEnemy(wave, boss=false, pathIndex=0, bossType=null, typeId=null, route=0){
  const rd=clamp(route|0,0,routeCount()-1);
  const pd=getPathData(rd);
  let e;
  if(boss){
    const bt=bossType||getBossType(wave);
    const s=bossEnemyStats(bt,wave);
    e={ id:uid(), boss:true, name:bt.name, bossType:bt.id, bossTypeName:bt.name,
      bossColor:bt.color, icon:bt.icon||'👾', color:bt.color,
      hp:s.hp, maxHp:s.hp, armor:s.armor, speed:s.speed, radius:28,
      reward:s.reward, baseDamage:s.baseDamage,
      slowResist:.55, summonTimer:4.5, rage:false };
  } else {
    const type=ENEMY_TYPES.find(t=>t.id===typeId)||ENEMY_TYPES[0];
    const s=normalEnemyStats(type,wave);
    e={ id:uid(), boss:false, name:type.name, typeId:type.id, color:type.color, icon:type.icon||'',
      hp:s.hp, maxHp:s.hp, armor:s.armor, speed:s.speed, radius:type.radius||14,
      reward:s.reward, baseDamage:s.baseDamage,
      slowResist:type.slowResist||0, summonTimer:0, rage:false };
  }
  Object.assign(e,{ d:0, route:rd, slow:1, slowTimer:0, alive:true, ox:0, oy:0, hitFlash:0, progress:0, inTunnel:false, inTunnelT:0 });
  if(e.typeId==='digger'){ e.invincible=true; e.icon='⛏️'; }
  syncEnemyPosition(e);
  return e;
}

/* ═══════════════════════════════════════════════════════════
   TUNNELS — 掘地兽挖的地道
   入口在路线前段、出口在靠近基地但至少留 2.8 格；地道 open 后，
   后续敌人从入口直接跳到出口，跳过中间路段。玩家可以花钱封堵。
   ═══════════════════════════════════════════════════════════ */
function tunnelRepairCost(){ return 500+(state.tunnelRepairs||0)*250; }
function updateDigger(enemy,erd){
  const route=clamp(enemy.route||0,0,routeCount()-1);
  // 该路线已经有地道：不再重复挖，走一小段后自动消失（无敌单位不能去撞基地）
  if(enemy._digged){
    if(enemy.d>=Math.min(6,erd.len*.3)){
      enemy._digged=false;
      killEnemy(enemy,{silent:true});
    }
    return;
  }
  if(!enemy._tunnelRef){
    if(state.tunnels.some(t=>t.route===route)){ enemy._digged=true; return; }
    if(enemy.d<erd.len*.14) return;
    // 入洞点随机（路线前 14%~30%），出洞点随机，且距离基地至少 5 格
    const entryD=erd.len*(.14+Math.random()*.16);
    const minExit=entryD+3.2;
    const maxExit=erd.len-5;
    if(maxExit<=minExit+1){ enemy._digged=true; return; }   // 路线太短，挖不了
    const exitD=minExit+Math.random()*(maxExit-minExit);
    const t={ id:uid(), route, entryD, exitD, status:'digging', bornAt:state.time };
    state.tunnels.push(t);
    enemy._tunnelRef=t.id;
    const p=pointAtDistance(entryD,route);
    const px=pathPointToPx(p.x,p.y);
    createParticles(px.x,px.y,22,'#c98b52',1.1);
    floatingText(px.x,px.y-24,'⛏ 掘地兽开始打洞','#e6b17a',false);
    setMsg('⛏ 掘地兽正在地下打洞！地道贯通后敌人会跳过大部分路线，点洞口可花金币封堵。');
    scheduleAutoSave();
    return;
  }
  const t=state.tunnels.find(x=>x.id===enemy._tunnelRef);
  if(!t){ enemy._digged=true; enemy._tunnelRef=null; return; }
  if(t.status==='digging'&&enemy.d>=t.exitD){
    t.status='open'; t.openedAt=state.time;
    const p=pointAtDistance(t.exitD,t.route);
    const px=pathPointToPx(p.x,p.y);
    createParticles(px.x,px.y,30,'#ffb066',1.25);
    state.shake=Math.max(state.shake,3);
    showBanner('⛏ 地道贯通 · 敌人开始抄近路');
    setMsg(`⛏ 地道已贯通！点入口/出口封堵（${tunnelRepairCost()} 金币）。`);
    // 挖完立即死亡：不再作为无敌单位继续走向基地
    enemy._digged=false; enemy._tunnelRef=null;
    killEnemy(enemy,{silent:false});
  }
}
function maybeEnterTunnel(enemy,erd){
  if(enemy.typeId==='digger'||enemy.inTunnel) return false;
  const t=state.tunnels.find(x=>x.status==='open'&&x.route===(enemy.route||0));
  if(!t) return false;
  if(enemy.d<=t.entryD||enemy.d>=t.exitD) return false;
  enemy.inTunnel=true;
  enemy.tunnelExit=t.exitD;
  enemy.tunnelRef=t.id;
  enemy.inTunnelT=clamp((t.exitD-t.entryD)/Math.max(.12,enemy.speed)*.2,.7,2.2);
  enemy.ox=0; enemy.oy=0;
  const p=pointAtDistance(enemy.d,enemy.route||0);
  const px=pathPointToPx(p.x,p.y);
  createParticles(px.x,px.y,8,'#c98b52',.8);
  return true;
}

function repairTunnel(id){
  const t=state.tunnels.find(x=>x.id===id); if(!t) return;
  const cost=tunnelRepairCost();
  if(state.gold<cost){ setMsg(`金币不足，封堵需要 ${cost} 金币。`); sfx('deny'); return; }
  state.gold-=cost; state.tunnelRepairs=(state.tunnelRepairs||0)+1;
  // 洞里/路上的敌人退回入口
  for(const e of state.enemies){
    if(e.tunnelRef===t.id){
      if(e.inTunnel){ e.inTunnel=false; e.d=Math.min(e.d,t.entryD); syncEnemyPosition(e); }
      e.tunnelRef=null;
      if(e.typeId==='digger'){ e._digged=true; e._tunnelRef=null; }
    }
  }
  const p=pointAtDistance(t.entryD,t.route), q=pointAtDistance(t.exitD,t.route);
  for(const pt of [p,q]){ const px=pathPointToPx(pt.x,pt.y);
    createParticles(px.x,px.y,26,'#9fb4c8',1.1); }
  state.tunnels=state.tunnels.filter(x=>x.id!==t.id);
  state.shake=Math.max(state.shake,2);
  sfx('sell');
  closeOverlay();
  setMsg(`🧱 地道已封堵（-${cost} 金币）。下次封堵需要 ${tunnelRepairCost()} 金币。`);
  scheduleAutoSave();
}

/* Re-derives an enemy's pixel position from its path distance. */
function syncEnemyPosition(e){
  const rd=e.route||0; const p=pointAtDistance(e.d||0,rd); const b=state.board; const pd=getPathData(rd);
  e.x=b.x+p.x*b.cell+(e.ox||0);
  e.y=b.y+p.y*b.cell+(e.oy||0);
  e.progress=clamp((e.d||0)/pd.len,0,1);
  e.seg=p.i;
  return e;
}
function syncAllEnemyPositions(){ for(const e of state.enemies) if(e.alive) syncEnemyPosition(e); }

const MAX_PARTICLES=300;
function createParticles(x,y,count,color,power=1){
  if(state.particles.length>MAX_PARTICLES) count=Math.max(0,Math.floor(count*.3));
  for(let i=0;i<count;i++){
    const a=Math.PI*2*i/count+Math.random()*.4;
    const s=(60+Math.random()*130)*power;
    state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.55+Math.random()*.35,maxLife:.55+Math.random()*.35,size:2+Math.random()*3.5,color});
  }
}
function floatingText(x,y,text,color='#fff',big=false){
  if(state.texts.length>140) state.texts.shift();
  state.texts.push({x,y,text,color,big:!!big,life:big?1:0.8,maxLife:big?1:0.8});
}

/* ═══════════════════════════════════════════════════════════
   GAME LOGIC
   ═══════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════
   RANDOM MAP — 只用 index 内的地图生成器，不依赖编辑器。
   尺寸 ≥ 12×9，最多 3 条出生路线，全部通向同一个基地格。
   ═══════════════════════════════════════════════════════════ */
let _randomMapSeq=0;
function generateRandomMap(){
  const W=12+Math.floor(Math.random()*4), H=9+Math.floor(Math.random()*3);
  const by=2+Math.floor(Math.random()*(H-4));
  const routesCount=1+(Math.random()<.55?1:0)+(Math.random()<.3?1:0);
  const routes=[];
  const pushSeg=(pts,from,to)=>{
    let [x,y]=from;
    pts.push([x,y]);
    while(x!==to[0]||y!==to[1]){
      if(x!==to[0]) x+=Math.sign(to[0]-x);
      else if(y!==to[1]) y+=Math.sign(to[1]-y);
      const last=pts[pts.length-1];
      if(last[0]!==x||last[1]!==y) pts.push([x,y]);
    }
  };
  for(let r=0;r<routesCount;r++){
    const pts=[];
    if(r===0){
      let sy=Math.floor(Math.random()*H);
      if(sy===by) sy=clamp(by+(by<=H-2?2:-2),0,H-1);
      const ex=2+Math.floor(Math.random()*(W-4));
      pushSeg(pts,[0,sy],[ex,sy]);
      if(sy!==by) pushSeg(pts,[ex,sy],[ex,by]);
      pushSeg(pts,[ex,by],[W-1,by]);
    } else if(r===1){
      const sx=2+Math.floor(Math.random()*(W-4));
      const ey=1+Math.floor(Math.random()*(H-2));
      pushSeg(pts,[sx,0],[sx,ey]);
      if(ey!==by) pushSeg(pts,[sx,ey],[W-2,ey]);
      pushSeg(pts,[W-2,ey],[W-1,ey]);
      if(ey!==by) pushSeg(pts,[W-1,ey],[W-1,by]);
    } else {
      const sx=2+Math.floor(Math.random()*(W-4));
      const ey=1+Math.floor(Math.random()*(H-2));
      pushSeg(pts,[sx,H-1],[sx,ey]);
      if(ey!==by) pushSeg(pts,[sx,ey],[W-2,ey]);
      pushSeg(pts,[W-2,ey],[W-1,ey]);
      if(ey!==by) pushSeg(pts,[W-1,ey],[W-1,by]);
    }
    // 去掉重复格，保证连续
    const clean=[];
    for(const c of pts){
      const last=clean[clean.length-1];
      if(last&&last[0]===c[0]&&last[1]===c[1]) continue;
      clean.push(c);
    }
    if(clean.length>1) routes.push(clean);
  }
  if(!routes.length) return null;
  const names=['随机星域','漂泊航道','碎星走廊','无名前线','折叠空域'];
  const themes=[
    ['#071522','#0f2a38','#174a56'],
    ['#120a1c','#221438','#3a2050'],
    ['#071a16','#0e2c24','#174636'],
    ['#1a1208','#2c1e10','#4a3218']
  ][Math.floor(Math.random()*4)];
  const seq=_randomMapSeq++;
  const map={
    id:'random_'+Date.now().toString(36)+'_'+seq,
    name:names[Math.floor(Math.random()*names.length)]+' #'+(seq+1),
    bossName:'随机领主', desc:`随机生成 ${W}×${H} · ${routes.length} 条出生路线`,
    theme:themes, roadFill:'rgba(88,104,122,.86)', roadEdge:'rgba(150,190,210,.4)',
    grassA:'rgba(10,24,36,.92)', grassB:'rgba(8,20,30,.92)',
    glow:'rgba(110,231,255,.2)', accentColor:'#6ee7ff', deco:'forest',
    gridW:W, gridH:H, hpMul:1.08, paths:routes
  };
  MAPS.push(map);
  _previewCache.clear();
  return map.id;
}
function openRandomMap(){
  const id=generateRandomMap();
  if(!id){ setMsg('随机地图生成失败，请再试一次。'); return; }
  state.previewMode=false;
  resetGame(id);
  setMsg(`🎲 已生成随机地图《${currentMap().name}》${GRID_W}×${GRID_H} · ${routeCount()} 条路线。`);
  renderStatic();
}

function resetGame(stageId=state.stageId){
  state.resumePending=false;
  const saved={activeMods:state.activeMods,soundOn:state.soundOn,selectedTowerType:state.selectedTowerType,gameSpeed:state.gameSpeed};
  Object.assign(state,{

    towers:[],enemies:[],projectiles:[],particles:[],texts:[],

let overlayArmAt=0;
function openOverlay(mode,payload=null){ closeBuildWheel(); state.overlayMode=mode; renderOverlay(payload); document.getElementById('overlay').classList.add('show'); overlayArmAt=performance.now()+300; }
/* 关闭弹窗时必须同时取消炮台选中，否则射程圈会在界面上“残留”。
   （点击炮台会选中并打开面板，面板关掉后选中状态也要一起清掉。） */
function closeOverlay(){

/* ═══════════════════════════════════════════════════════════
   SAVE / LOAD — export current progress as a downloadable JSON
   file, and restore it later. Runtime-only state (enemies,
   projectiles, particles) is intentionally NOT saved — the wave
   in progress is discarded and the player resumes at "ready".
   ═══════════════════════════════════════════════════════════ */
const SAVE_TAG='starocean_td_save';

/* Sanitises bestiary kill counts coming from a save file. */
function normalizeCodex(src){
  const out={enemies:{},bosses:{}};
  if(src&&typeof src==='object'){
    for(const g of ['enemies','bosses']){
      const bucket=src[g];
      if(!bucket||typeof bucket!=='object')continue;
      for(const [k,v] of Object.entries(bucket)){
        const n=Number(v);
        if(Number.isFinite(n)&&n>0) out[g][k]=Math.min(1e9,Math.floor(n));
      }
    }
  }
  return out;
}

/* 单前地图的完整快照：自定义地图/编辑器试玩也能随存档一起带走。 */
function mapSnapshot(){
  try{ return JSON.parse(JSON.stringify(currentMap())); }catch(e){ return null; }
}
function registerSavedMap(def){
  if(!def||typeof def!=='object'||!def.id) return false;
  if(MAPS.some(m=>m.id===def.id)) return true;
  const routes=Array.isArray(def.paths)&&def.paths.length?def.paths:(Array.isArray(def.path)&&def.path.length?[def.path]:null);
  if(!routes) return false;
  let w=0,h=0;
  for(const r of routes) for(const c of r){ if(Array.isArray(c)){ w=Math.max(w,c[0]+1); h=Math.max(h,c[1]+1); } }
  if(w<3||h<3) return false;
  const copy=JSON.parse(JSON.stringify(def));
  copy.gridW=Math.max(Number(copy.gridW)||0,w);
  copy.gridH=Math.max(Number(copy.gridH)||0,h);
  delete copy.__modId;          // 存档地图不依赖模组是否加载
  copy.__savedMap=true;
  MAPS.push(copy);
  return true;
}

function serializeSave(){
  return {
    __save:SAVE_TAG, version:3, savedAt:Date.now(),
    stageId:state.stageId, mapName:currentMap().name, mapDef:mapSnapshot(), runId:state.runId, wave:state.wave, gold:state.gold, skillPoints:state.skillPoints,
    skills:state.skills, base:state.base, autoWave:state.autoWave, autoSave:state.autoSave,
    codex:state.codex,
    towers:state.towers.map(t=>({type:t.type,x:t.x,y:t.y,level:t.level,kills:t.kills||0,
      facingAngle:t.facingAngle||0,invested:t.invested})),
    tunnels:state.tunnels.map(t=>({route:t.route,entryD:t.entryD,exitD:t.exitD,status:t.status,bornAt:t.bornAt||0})),
    tunnelRepairs:state.tunnelRepairs||0,
    activeMods:[...state.activeMods], soundOn:state.soundOn, gameSpeed:state.gameSpeed,
    selectedTowerType:state.selectedTowerType,
  };
}

function downloadSave(){
  const data=serializeSave();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const ts=new Date(); const pad=n=>String(n).padStart(2,'0');
  const fname=`星海防线_存档_${ts.getFullYear()}${pad(ts.getMonth()+1)}${pad(ts.getDate())}_${pad(ts.getHours())}${pad(ts.getMinutes())}.json`;
  const a=document.createElement('a'); a.href=url; a.download=fname;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  writeAutoSave();
  setMsg('存档已导出到下载文件夹（本机自动存档也已刷新）。');
}

/* ═══════════════════════════════════════════════════════════
   AUTOSAVE — a rolling snapshot in localStorage. It is written
   between waves, on important purchases, every 30s, and when the
   page is hidden/unloaded; the next visit offers to resume it.
   ═══════════════════════════════════════════════════════════ */
const AUTOSAVE_KEY='starocean_td_autosave';
let _autoSaveTimer=null;
let _storageOk=null;

function storageAvailable(){
  if(_storageOk!==null) return _storageOk;
  try{
    if(typeof localStorage==='undefined'){ _storageOk=false; }
    else{
      const probe='__td_probe__';
      localStorage.setItem(probe,'1');
      localStorage.removeItem(probe);
      _storageOk=true;
    }
  }catch(e){ _storageOk=false; }
  state.autoSaveAvailable=_storageOk;
  return _storageOk;
}

function readAutoSave(){
  try{
    if(typeof localStorage==='undefined')return null;
    const raw=localStorage.getItem(AUTOSAVE_KEY);
    if(!raw)return null;
    const data=JSON.parse(raw);
    if(!data||data.__save!==SAVE_TAG)return null;
    return data;
  }catch(e){ return null; }
}

function writeAutoSave(){
  if(state.previewMode)return false;     // 编辑器试玩不写入正式自动存档
  if(!state.autoSave)return false;
  if(state.resumePending)return false;   // never overwrite an undecided snapshot
  if(state.gameOver)return false;        // keep the last good checkpoint after a loss
  if(!storageAvailable())return false;
  try{
    const data=serializeSave();
    data.autosave=true;
    data.playing=state.waveState==='spawning';
    localStorage.setItem(AUTOSAVE_KEY,JSON.stringify(data));
    state.lastAutoSave=Date.now();
    updateAutoSaveUI();
    return true;
  }catch(e){ console.warn('[autosave] 写入失败：',e); return false; }
}

/* ═══════════════════════════════════════════════════════════
   SAVE HISTORY — 多条手动/自动检查点，重启不消失。
   每条记录自带地图完整定义，所以自定义地图也能直接读回。
   超过 30 天未打开的记录会在读取时自动清理。
   ═══════════════════════════════════════════════════════════ */
const SAVE_HISTORY_KEY='starocean_td_saves_v1';
const SAVE_HISTORY_TTL=30*24*60*60*1000;
const SAVE_HISTORY_MAX=24;

function readSaveHistory(){
  try{
    if(typeof localStorage==='undefined') return [];
    const raw=localStorage.getItem(SAVE_HISTORY_KEY);
    if(!raw) return [];
    let list=JSON.parse(raw);
    if(!Array.isArray(list)) return [];
    const now=Date.now();
    list=list.filter(r=>r&&r.id&&r.data&&r.data.__save===SAVE_TAG&&now-(r.lastOpenedAt||r.savedAt||0)<=SAVE_HISTORY_TTL);
    list.sort((a,b)=>(b.lastOpenedAt||0)-(a.lastOpenedAt||0));
    if(list.length) localStorage.setItem(SAVE_HISTORY_KEY,JSON.stringify(list));
    return list;
  }catch(e){ return []; }
}
function writeSaveHistory(list){
  try{
    while(list.length>SAVE_HISTORY_MAX) list.pop();
    localStorage.setItem(SAVE_HISTORY_KEY,JSON.stringify(list));
    return true;
  }catch(e){
    try{
      while(list.length>8){ list.pop(); }
      localStorage.setItem(SAVE_HISTORY_KEY,JSON.stringify(list));
      return true;
    }catch(_){ setMsg('浏览器存储已满，历史存档写入失败，请先删除旧存档。'); return false; }
  }
}
function saveToHistory(silent=false,key=null){
  if(!storageAvailable()){ if(!silent)setMsg('浏览器禁止本地存储，无法保存历史存档。'); return null; }
  const list=readSaveHistory();
  const now=Date.now();
  const data=serializeSave();
  const rec={
    id:key||('run_'+uid()), name:`${currentMap().name} · 第 ${state.wave} 波`,
    savedAt:now, lastOpenedAt:now, wave:state.wave, mapName:currentMap().name,
    towers:(state.towers||[]).length, data
  };
  const idx=list.findIndex(r=>r.id===rec.id);
  if(idx>=0) list.splice(idx,1);
  list.unshift(rec);
  if(writeSaveHistory(list)){
    if(!silent) setMsg(`📌 已保存到历史存档：${rec.name}（共 ${list.length} 条，30 天未打开会自动清理）。`);
    refreshSaveHistoryBtn();
    return rec;
  }
  return null;
}

function fmtClock(ts){

  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function applySave(data){
  if(!data||data.__save!==SAVE_TAG){ setMsg('读取失败：不是有效的存档文件。'); return; }
  state.resumePending=false;
  closeBuildWheel();
  let mapExists=MAPS.some(m=>m.id===data.stageId);
  if(!mapExists&&data.mapDef&&data.mapDef.id===data.stageId){
    mapExists=registerSavedMap(data.mapDef);
  }
  if(mapExists) state.stageId=data.stageId;
  applyMapGrid();              // 在读炮台之前先按新地图更新 GRID_W/GRID_H
  invalidatePathPixelCache();
  if(data.runId) state.runId=String(data.runId);
  state.wave=Math.max(1,data.wave|0);
  state.gold=Math.max(0,Number(data.gold)||0);
  state.skillPoints=Math.max(0,data.skillPoints|0);
  state.skills=(data.skills&&typeof data.skills==='object')?data.skills:{};
  const cleanSkills={};
  for(const [k,v] of Object.entries(state.skills)){
    const n=Number(v);
    if(Number.isFinite(n)&&n>0) cleanSkills[k]=Math.min(9999,Math.floor(n));
  }
  state.skills=cleanSkills;
  state.codex=normalizeCodex(data.codex);
  if(data.autoSave!=null) state.autoSave=!!data.autoSave;
  state.previewMode=false;
  state.base=Object.assign({...GAME_BALANCE.defaultBase},data.base||{});
  state.base.maxHp=Math.max(1,Number(state.base.maxHp)||GAME_BALANCE.defaultBase.maxHp);
  state.base.hp=clamp(Number(state.base.hp)||state.base.maxHp,1,state.base.maxHp);
  state.base.level=Math.max(1,Math.floor(Number(state.base.level)||1));
  state.base.damage=Math.max(1,Number(state.base.damage)||GAME_BALANCE.defaultBase.damage);
  state.base.range=clamp(Number(state.base.range)||GAME_BALANCE.defaultBase.range,.5,10);
  state.base.fireRate=clamp(Number(state.base.fireRate)||GAME_BALANCE.defaultBase.fireRate,.1,5);
  state.base.cooldown=0;
  const pset=pathSet(); const used=new Set(); const towers=[];
  for(const raw of (data.towers||[])){
    const type=TOWER_TYPES[raw.type];
    if(!type||!Number.isFinite(raw.x)||!Number.isFinite(raw.y)) continue;
    const foot=type.size===2?[[raw.x,raw.y],[raw.x+1,raw.y],[raw.x,raw.y+1],[raw.x+1,raw.y+1]]:[[raw.x,raw.y]];
    if(foot.some(([fx,fy])=>fx<0||fy<0||fx>=GRID_W||fy>=GRID_H||pset.has(`${fx},${fy}`))) continue;
    if(foot.some(([fx,fy])=>used.has(`${fx},${fy}`))) continue;
    foot.forEach(([fx,fy])=>used.add(`${fx},${fy}`));
    const tw=makeTower(raw.type,raw.x,raw.y);
    tw.level=Math.max(1,raw.level|0); tw.kills=Math.max(0,raw.kills|0);
    tw.facingAngle=Number.isFinite(raw.facingAngle)?raw.facingAngle:Math.PI/2;
    tw.invested=Math.max(type.cost||100,Number(raw.invested)||0);
    towers.push(tw);
  }
  state.towers=towers;
  state.enemies=[]; state.projectiles=[]; state.particles=[]; state.texts=[];
  state.tunnelRepairs=Math.max(0,data.tunnelRepairs|0);
  state.tunnels=Array.isArray(data.tunnels)?data.tunnels.filter(t=>t&&Number.isFinite(t.entryD)&&Number.isFinite(t.exitD)).map(t=>({id:uid(),route:clamp(t.route|0,0,routeCount()-1),entryD:t.entryD,exitD:t.exitD,status:t.status==='open'?'open':'digging',bornAt:Number(t.bornAt)||0})):[];
  state.waveState='ready'; state.spawnQueue=[]; state.spawnTimer=0;
  state.wavePlan=null; state.waveTotal=0; state.waveSpawned=0; state.waveKilled=0; state.waveLeaked=0;
  state.gameOver=false; state.paused=false; state.priorityTargetId=null; state.selectedTowerId=null;
  state.baseFlash=0; state.towersRev=state.towersRev+1;
  if(Array.isArray(data.activeMods)){
    const loadedIds=new Set(window.__mods.map(m=>m.id));
    state.activeMods=new Set(data.activeMods.filter(id=>loadedIds.has(id)));
  }
  state.soundOn=!!data.soundOn; state.gameSpeed=SPEED_CYCLE.includes(data.gameSpeed)?data.gameSpeed:1;
  state.autoWave=!!data.autoWave;
  state.autoTimer=state.autoWave?GAME_BALANCE.autoWaveDelay:0;
  state.selectedTowerType=TOWER_TYPES[data.selectedTowerType]?data.selectedTowerType:state.selectedTowerType;
  state._uiCache={gold:null,hp:null,skillPoints:null,wave:null,enemyCount:null,waveTag:null};
  applyMapGrid(); fitBoard(); renderStatic();
  writeAutoSave();
  updateAutoSaveUI();
  closeOverlay();
  setMsg(mapExists?'存档已读取，继续守卫基地吧！':`⚠️ 存档使用的地图「${data.stageId}」尚未加载（可能是自定义地图模组），已恢复其余进度，请先在模组面板加载对应模组，再切换到该地图。`);
}

function effectiveStats(tower){
  const type=TOWER_TYPES[tower.type]||TOWER_TYPES.cannon;
  const lv=Math.max(1,tower.level|0), s=state.skills;
  const dmgMul = 1+(s.pow||0)*.12+(s.core||0)*.04+(s.overdrive||0)*.03+(s.ultimate1||0)*.03+(s.omega||0)*.02;
  const rateMul = 1+(s.spd||0)*.10+(s.core||0)*.03+(s.haste||0)*.06+(s.overdrive||0)*.05+(s.ultimate1||0)*.03+(s.omega||0)*.02;
  const rngMul  = 1+(s.rng||0)*.08+(s.core||0)*.02+(s.scope||0)*.05+(s.ultimate1||0)*.03+(s.omega||0)*.02;
  const growMul = 1+(lv-1)*(0.38+(s.turret||0)*0.012);
  const damage = Math.max(1,Math.round((type.baseDamage||10)*growMul*dmgMul));
  const cooldown = Math.max(.15,(type.baseFireRate||1)/rateMul);
  const splashCells = (type.splash||0)*(1+(s.cri||0)*.04+(s.splash2||0)*.06);
  return {
    damage,
    cooldown,
    fireRate:cooldown,       // legacy alias (seconds between shots)
    dps:damage/cooldown,
    range:(type.baseRange||2.5)*rngMul*(tower.type==='laser'?1+(lv-1)*.02:1),
    projectileSpeed:type.projectileSpeed||8,
    splashCells, splash:splashCells,
    slow:Math.min(.8,(type.slow||0)*(1+(s.fro||0)*.12+(s.frostnova||0)*.08)),
    pierce:(type.pierce||0)+(tower.type==='laser'?Math.floor((s.link||0)/2):0),
    armorPen:Math.min(1,(type.armorPen||0)+(s.link||0)*.01),
    critChance:Math.min(.5,(s.cri||0)*.07),
    critMul:1.9,
    bossMul:1+(s.boss||0)*.10,
    goldMul:1+(s.eco||0)*.15+(s.ultimate2||0)*.05+(s.omega||0)*.02,
  };
}

function baseEffectiveStats(){
  const s=state.skills; const b=state.base; const lv=b.level;
  const mul=1+(s.fort||0)*.08+(s.core||0)*.03+(s.ultimate2||0)*.05+(s.omega||0)*.02;
  const cd=Math.max(.35,b.fireRate-(lv-1)*.035);
  return {
    damage:Math.round(b.damage*(1+(lv-1)*.32)*mul),
    range:b.range*(1+(lv-1)*.05)*(1+(s.fort||0)*.03+(s.scope||0)*.04),
    fireRate:cd,
    cooldown:cd,
  };
}

function superLaserStats(){
  const s=state.skills;
  const mul=1+(s.pow||0)*.05+(s.overdrive||0)*.025+(s.ultimate1||0)*.03+(s.omega||0)*.02;
  return { damage:Math.round(550*mul), splashCells:.7, armorPen:1, critChance:.2, critMul:2, bossMul:1.6 };
}

function baseUpgradeCost(){
  const lv=state.base.level;
  return Math.round(160*Math.pow(1.38,lv-1));
}

/* ── Base auto-heal (科技「基地再生」) ──
   Returns HP restored per second. 每级 0.4% 最大血量/秒，上限 12%/秒，
   避免科技堆满后基地变成无敌。 */
function baseRegenPct(lv){ return lv>0?Math.min(.12,lv*.004):0; }
function baseRegenPerSec(){
  // Lv 科技「基地再生」0.4%/级 + 「纳米自愈」1.2%/级，总上限 20%/秒
  const pct=Math.min(.20,(state.skills.regen||0)*.004+(state.skills.regen2||0)*.012);
  return state.base.maxHp*pct;
}

function startWave(){
  if(state.gameOver||state.paused||state.waveState!=='ready')return;
  state.resumePending=false;             // playing supersedes an unanswered resume prompt
  const plan=buildWave(state.wave);
  state.wavePlan=plan;
  state.spawnQueue=plan.entries.map(e=>({...e}));
  state.waveTotal=plan.total; state.waveSpawned=0; state.waveKilled=0; state.waveLeaked=0;
  state.spawnTimer=.35; state.waveState='spawning'; state.autoTimer=0;
  const bossWave=!!plan.boss;
  setMsg(bossWave?`第${state.wave}波：${plan.boss.icon} ${plan.boss.name} 正在接近！`:
         `第${state.wave}波开始，共 ${plan.total} 个敌人。`);
  showBanner(bossWave?`⚠ 第 ${state.wave} 波 · BOSS 来袭`:`第 ${state.wave} 波`,bossWave);
  sfx(bossWave?'boss':'wave');
  renderStatic();
  callHook('onWaveStart',state.wave);

function lateGameSkillBonus(){ return Math.floor(state.wave/8); } // grows every 8 waves survived

function waveClearReward(wave){
  const eco=1+(state.skills.eco||0)*.15+(state.skills.ultimate2||0)*.05+(state.skills.omega||0)*.02;
  const gold=Math.round((38+wave*10)*eco+(state.skills.res||0)*14);
  const sp=1+Math.floor(wave/5)+(wave%5===0?2:0)+lateGameSkillBonus();
  return {gold,sp};
}

function nextWaveDone(){
  if(state.waveState!=='spawning')return;   // guard against a double clear
  state.waveState='cleared';
  const cleared=state.wave;
  const {gold,sp}=waveClearReward(cleared);
  state.gold+=gold; state.skillPoints+=sp;
  state.wave=cleared+1;
  state.waveState='ready'; state.spawnQueue=[]; state.spawnTimer=0; state.wavePlan=null;
  state.waveTotal=0; state.waveSpawned=0; state.waveKilled=0; state.waveLeaked=0;
  if(state.autoWave) state.autoTimer=GAME_BALANCE.autoWaveDelay;
  setMsg(`第${cleared}波清空！+${sp} 技能点 · +${gold} 金币${state.autoWave?` · ${GAME_BALANCE.autoWaveDelay}s 后自动开波`:''}`);
  showBanner(`第 ${cleared} 波 · 清空`,false);
  sfx('coin'); renderStatic();
  writeAutoSave();                       // wave boundaries are the safest snapshot
  saveToHistory(true,'run_'+state.runId);   // 每局一条可回看的历史存档
  callHook('onWaveClear',cleared);

function buyTech(id){
  const node=TECHS.find(n=>n.id===id); if(!node)return;
  const lv=state.skills[id]||0;
  if(!node.req.every(r=>(state.skills[r]||0)>0)){ setMsg('先解锁上游科技。'); renderOverlay(); return; }
  const cost=skillCost(lv,node.base);
  if(state.skillPoints<cost){ setMsg('技能点不足。'); renderOverlay(); return; }
  state.skillPoints-=cost; state.skills[id]=lv+1;

  setMsg(`「${node.name}」升到 Lv.${lv+1} · 需 ${skillCost(lv+1,node.base)} 点升下一级`);

function upgradeBase(){
  const cost=baseUpgradeCost();
  if(state.gold<cost){ setMsg(`金币不足，升级基地需要 ${cost} 金。`); return; }
  state.gold-=cost; state.base.level+=1;
  state.base.maxHp+=140; state.base.damage+=16;
  state.base.range=Math.min(6,state.base.range+.05);
  state.base.hp=Math.min(state.base.maxHp,state.base.hp+Math.round(state.base.maxHp*.25)+60);
  setMsg(`基地升级到 Lv.${state.base.level}！下次升级需 ${baseUpgradeCost()} 金。`);
  sfx('upgrade'); createParticles(basePosition().x,basePosition().y,24,'#ffd36b',1.2);
  state.shake=Math.max(state.shake,2); renderStatic(); renderOverlay('base');
  scheduleAutoSave();
}

/* ── Tower / projectile logic ── */
function nearestEnemy(center,rangePx){
  if(state.priorityTargetId){
    const pe=state.enemies.find(e=>e.id===state.priorityTargetId&&e.alive&&!e.inTunnel&&!e.invincible);
    if(pe&&dist(center,pe)<=rangePx) return pe;
  }
  let best=null,bestScore=-Infinity;
  for(const e of state.enemies){
    if(!e.alive||e.inTunnel||e.invincible)continue; const d=dist(center,e);
    if(d<=rangePx){ const s=e.progress*1000-e.hp*.01; if(s>bestScore){best=e;bestScore=s;} }
  }
  return best;
}

function mostAdvancedEnemy(){
  let best=null,bestProg=-1;
  for(const e of state.enemies){ if(!e.alive||e.inTunnel)continue; if(e.progress>bestProg){best=e;bestProg=e.progress;} }
  return best;
}

    splashCells:stats.splashCells||0,pierce:stats.pierce||0,armorPen:stats.armorPen||0,
    critChance:stats.critChance||0,critMul:stats.critMul||1.8,goldMul:stats.goldMul||1,
    bossMul:stats.bossMul||1,color:col,ownerId:tower.id,trail:[],isBase:false});
  tower.cooldown=stats.cooldown||1; tower.flash=.12;

}
