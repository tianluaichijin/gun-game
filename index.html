/* Strongest slow wins; bosses resist part of it. */
function applySlow(enemy,strength,duration=1.6){
  if(!enemy||!enemy.alive||strength<=0)return;
  const applied=Math.min(.85,strength*(1-clamp(enemy.slowResist||0,0,.85)));
  if(applied<=0)return;
  enemy.slow=Math.min(enemy.slow,1-applied);
  enemy.slowTimer=Math.max(enemy.slowTimer,duration);
}

/* Single entry point for all damage: armor, boss multiplier, crit, floating
   text, kill credit. Splash also goes through here so rewards/kills stay right. */
function damageEnemy(enemy,amount,opts={}){
  if(!enemy||!enemy.alive)return 0;
  if(enemy.invincible){
    if(state.time-(enemy._invFlashAt||-99)>.9){
      enemy._invFlashAt=state.time;
      floatingText(enemy.x,enemy.y-(enemy.radius||16)-10,'无敌','#cbd5e1',false);
    }
    return 0;
  }
  let dmg=Math.max(0,amount);
  if(enemy.boss) dmg*=(opts.bossMul||1);
  const armor=clamp(enemy.armor||0,0,.8);
  dmg*=(1-armor*(1-clamp(opts.armorPen||0,0,1)));
  dmg=Math.max(1,Math.round(dmg));
  enemy.hp-=dmg; enemy.hitFlash=.14;
  const col=opts.color||[255,240,210];
  createParticles(opts.x??enemy.x,opts.y??enemy.y,opts.crit?8:4,`rgb(${col.join(',')})`,opts.crit?1:.55);
  floatingText(enemy.x+(Math.random()*12-6),enemy.y-(enemy.radius||14)-8,`${dmg}`,
    opts.crit?'#ffd700':(enemy.boss?'#ffe9c4':'#fff6d6'),!!opts.crit);
  if(enemy.hp<=0) killEnemy(enemy,opts);
  return dmg;
}

function applyHit(enemy,proj,hx,hy){
  if(!enemy||!enemy.alive)return;
  const col=proj.color||[255,255,255];
  const crit=proj.critChance>0&&Math.random()<proj.critChance;
  let dmg=proj.damage*(crit?(proj.critMul||1.8):1);
  if(proj.slow>0) applySlow(enemy,proj.slow,1.5+(state.skills.fro||0)*.12);
  damageEnemy(enemy,dmg,{crit,armorPen:proj.armorPen||0,bossMul:proj.bossMul||1,
    ownerId:proj.ownerId,x:hx,y:hy,color:col});
  const heavy=proj.type==='cannon'||proj.type==='mortar'||proj.type==='superLaser'||proj.isBase;
  const radius=(proj.splashCells||0)*state.board.cell;
  if(heavy&&radius>2){
    for(const o of state.enemies){
      if(!o.alive||o.id===enemy.id)continue;
      const d=Math.hypot(o.x-hx,o.y-hy);
      if(d<=radius){
        const falloff=1-.55*(d/radius);
        damageEnemy(o,dmg*.55*falloff,{crit:false,armorPen:proj.armorPen||0,bossMul:proj.bossMul||1,
          ownerId:proj.ownerId,x:o.x,y:o.y,color:col});
      }
    }
  }
  sfx(enemy.hp<=0?'kill':'hit');
  state.shake=Math.max(state.shake,heavy?1.4:.6);
}

function killEnemy(enemy,opts={}){
  if(!enemy.alive)return; enemy.alive=false;
  if(state.priorityTargetId===enemy.id) state.priorityTargetId=null;
  const owner=opts.ownerId?state.towers.find(t=>t.id===opts.ownerId):null;
  if(owner) owner.kills=(owner.kills||0)+1;
  const eco=1+(state.skills.eco||0)*.15+(state.skills.ultimate2||0)*.05+(state.skills.omega||0)*.02;
  const reward=Math.round((enemy.reward||0)*eco);
  state.gold+=reward; state.waveKilled++;
  // Bestiary kill tally
  const codexKey=enemy.boss?enemy.bossType:enemy.typeId;
  if(codexKey){
    const bucket=enemy.boss?state.codex.bosses:state.codex.enemies;
    bucket[codexKey]=(bucket[codexKey]||0)+1;
  }
  callHook('onEnemyDie',enemy);
  const deathCol=enemy.boss?(enemy.bossColor||[255,211,107]):(opts.color||[255,140,120]);
  createParticles(enemy.x,enemy.y,enemy.boss?44:14,`rgb(${deathCol.join(',')})`,enemy.boss?1.4:.9);
  floatingText(enemy.x,enemy.y-20,`+${reward}`,'#9ef7c1',!!enemy.boss);
  state.shake=Math.max(state.shake,enemy.boss?10:2.2);
  if(enemy.boss){
    const spGain=2+lateGameSkillBonus();
    state.skillPoints+=spGain; sfx('kill');
    setMsg(`${enemy.icon||'👾'} ${enemy.name||'Boss'} 击败！+${spGain} 技能点 · +${reward} 金币`);
    floatingText(enemy.x,enemy.y-46,'BOSS DOWN','#ffd36b',true);
  }
}

/* ═══════════════════════════════════════════════════════════
   UPDATE LOOP
   ═══════════════════════════════════════════════════════════ */
function update(dt){
  if(state.paused||state.gameOver)return;
  state.time+=dt;
  callHook('onUpdate',dt);
  const pd=getPathData();
  const cell=state.board.cell;

  // Auto-wave countdown
  if(state.autoWave&&state.waveState==='ready'&&state.autoTimer>0){
    state.autoTimer-=dt;
    if(state.autoTimer<=0){ state.autoTimer=0; startWave(); if(state.gameOver)return; }
  }

  // ── Spawning ──
  if(state.waveState==='spawning'){
    state.spawnTimer-=dt;
    let guard=0;
    while(state.spawnTimer<=0&&state.spawnQueue.length>0&&guard++<50){
      const entry=state.spawnQueue.shift();
      const rcells=mapRoutesOf(currentMap())[clamp(entry.route||0,0,routeCount()-1)];
      const enter=cellCenter(rcells[0][0],rcells[0][1]);
      const e=makeEnemy(state.wave,!!entry.boss,0,entry.bossType||null,entry.typeId,entry.route||0);
      state.enemies.push(e); state.waveSpawned++;
      state.spawnTimer+=Math.max(.12,entry.delay||.4);
      if(entry.boss){
        state.shake=Math.max(state.shake,6); sfx('boss');
        createParticles(enter.x,enter.y,26,`rgb(${(e.bossColor||[255,180,80]).join(',')})`,1.15);
        showBanner(`${e.icon} ${e.name} 出现`,true);
      } else {
        createParticles(enter.x,enter.y,5,'#7fd6ff',.5);
      }
    }
    if(state.spawnQueue.length===0&&!state.enemies.some(e=>e.alive)) nextWaveDone();
  }

  // ── Towers ──
  for(const t of state.towers){
    t.cooldown=Math.max(0,t.cooldown-dt); t.flash=Math.max(0,t.flash-dt);
    if(t.type==='superLaser'){
      if(t.laserBeam){ t.laserBeam.life-=dt; if(t.laserBeam.life<=0)t.laserBeam=null; }
      let target=null;
      if(state.priorityTargetId) target=state.enemies.find(e=>e.id===state.priorityTargetId&&e.alive);
      if(!target) target=mostAdvancedEnemy();
      const slc=towerCenterPx(t);
      if(target){
        const desired=Math.atan2(target.x-slc.x,-(target.y-slc.y));
        t.facingAngle=rotateTowards(t.facingAngle,desired,ROT_SPEED*1.4*dt);
      }
      if(t.cooldown<=0&&target){
        t.targetId=target.id;
        t.laserBeam={sx:slc.x,sy:slc.y,tx:target.x,ty:target.y,life:.5,maxLife:.5};
        const st=superLaserStats();
        applyHit(target,{type:'superLaser',damage:st.damage,slow:0,splashCells:st.splashCells,pierce:0,
          critChance:st.critChance,critMul:st.critMul,goldMul:1,bossMul:st.bossMul,armorPen:st.armorPen,
          color:[0,240,255],ownerId:t.id,isBase:false},target.x,target.y);
        createParticles(target.x,target.y,26,'#00f0ff',1.3);
        t.cooldown=SUPERLASER_COOLDOWN; state.shake=Math.max(state.shake,5);
        sfx('superLaser');
      } else if(!target){ t.targetId=null; }
      continue;
    }
    const st=effectiveStats(t);
    const center=towerCenterPx(t);
    const target=nearestEnemy(center,st.range*cell);
    if(target){
      const desired=Math.atan2(target.x-center.x,-(target.y-center.y));
      t.facingAngle=rotateTowards(t.facingAngle,desired,ROT_SPEED*dt);
      if(t.cooldown<=0) addProjectile(t,target,st);
    }
  }

  // ── Base ──
  const bst=baseEffectiveStats(); const bpos=basePosition();
  state.base.cooldown=Math.max(0,state.base.cooldown-dt);
  state.baseFlash=Math.max(0,state.baseFlash-dt);
  if(state.base.cooldown<=0){
    const tgt=nearestEnemy(bpos,bst.range*cell);
    if(tgt){ addBaseProjectile(tgt); state.base.cooldown=bst.cooldown; }
  }

  // ── Base auto-heal (科技「基地再生」) ──
  const regen=baseRegenPerSec();
  if(regen>0&&state.base.hp<state.base.maxHp){
    const heal=Math.min(regen*dt,state.base.maxHp-state.base.hp);
    state.base.hp+=heal;
    state._regenAcc=(state._regenAcc||0)+heal;
    const step=Math.max(6,state.base.maxHp*.01);
    if(state._regenAcc>=step){
      floatingText(bpos.x+(Math.random()*18-9),bpos.y-30,`+${Math.round(state._regenAcc)}`,'#7dffbb',false);
      state._regenAcc=0;
    }
  } else if(state.base.hp>=state.base.maxHp){
    state._regenAcc=0;
  }

  // ── Enemy movement (path distance in cells) ──
  const newEnemies=[];
  let gameOverHit=false;
  for(const enemy of state.enemies){
    if(!enemy.alive)continue;
    const erd=getPathData(enemy.route||0);
    if(enemy.typeId==='digger') updateDigger(enemy,erd);
    if(!enemy.alive) continue;
    if(enemy.inTunnel){
      enemy.inTunnelT-=dt;
      if(enemy.inTunnelT<=0){
        enemy.inTunnel=false;
        enemy.d=Math.min(erd.len-.001,enemy.tunnelExit||enemy.d);
        syncEnemyPosition(enemy);
        createParticles(enemy.x,enemy.y,10,'#c98b52',.7);
      }
      continue;
    }
    if(maybeEnterTunnel(enemy,erd)) continue;
    if(enemy.hitFlash>0) enemy.hitFlash=Math.max(0,enemy.hitFlash-dt);
    if(enemy.slowTimer>0){
      enemy.slowTimer=Math.max(0,enemy.slowTimer-dt);
      if(enemy.slowTimer===0) enemy.slow=1;
    }
    if(enemy.boss){
      enemy.rage=enemy.hp/enemy.maxHp<.5;
      enemy.summonTimer-=dt;
      // Don't let a boss parked next to the base flood it with summons.
      const crowd=enemy.d/erd.len>.86||state.enemies.reduce((n,e)=>n+(e.alive&&!e.boss?1:0),0)>=42;
      if(enemy.summonTimer<=0){
        if(crowd){ enemy.summonTimer=.9; }
        else {
          const bt=BOSS_TYPES.find(b=>b.id===enemy.bossType)||BOSS_TYPES[0];
          const count=enemy.rage?bt.rageMinions:bt.minions;
          enemy.summonTimer=enemy.rage?bt.summonRate*.75:bt.summonRate;
          const types=ENEMY_TYPES.filter(t=>state.wave>=(t.unlock||1));
          const type=types[Math.floor(Math.random()*types.length)]||ENEMY_TYPES[0];
          for(let i=0;i<count;i++){
            const m=makeEnemy(state.wave,false,0,null,type.id,enemy.route||0);
            m.d=Math.min(enemy.d,erd.len*.9);
            m.ox=(Math.random()-.5)*26; m.oy=(Math.random()-.5)*26;
            m.speed*=1.05;
            syncEnemyPosition(m);
            newEnemies.push(m);
          }
          state.shake=Math.max(state.shake,1.6);
          createParticles(enemy.x,enemy.y,12,`rgb(${(enemy.bossColor||[255,211,107]).join(',')})`,.85);
        }
      }
    }
    enemy.d+=enemy.speed*enemy.slow*(enemy.rage?1.25:1)*dt;
    if(enemy.d>=erd.len){
      const dmg=Math.max(1,Math.round(enemy.baseDamage||10));
      state.base.hp=Math.max(0,state.base.hp-dmg);
      state.baseFlash=.5; state.waveLeaked++;
      createParticles(bpos.x,bpos.y,18,'#ff6b6b',1);
      floatingText(bpos.x,bpos.y-26,`-${dmg}`,'#ff8080',true);
      state.shake=Math.max(state.shake,enemy.boss?7:2.5);
      sfx('base_hit'); enemy.alive=false;
      callHook('onBaseHit',enemy,dmg);
      if(state.base.hp<=0){ gameOverHit=true; break; }
      continue;
    }
    syncEnemyPosition(enemy);
  }
  if(newEnemies.length) state.enemies.push(...newEnemies);
  if(gameOverHit){ triggerGameOver(); return; }

  // ── Projectiles (in-place compaction — avoids reallocating an array every frame) ──
  let pw=0;
  for(let i=0;i<state.projectiles.length;i++){
    const p=state.projectiles[i];
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),step=p.speed*dt;
    p.trail.push([p.x,p.y]); if(p.trail.length>6)p.trail.shift();
    if(d<=step||d<.5){
      const hx=p.tx,hy=p.ty;
      const r=p.type==='laser'?24:p.type==='mortar'?44:p.isBase?28:26;
      const hits=[];
      for(const e of state.enemies){
        if(!e.alive)continue;
        if(Math.hypot(e.x-hx,e.y-hy)<=r) hits.push(e);
      }
      if(hits.length){
        hits.sort((a,b)=>b.progress-a.progress);
        const limit=p.type==='laser'?1+(p.pierce||0):1;
        for(let h=0;h<Math.min(limit,hits.length);h++) applyHit(hits[h],p,hx,hy);
      } else {
        createParticles(hx,hy,6,`rgb(${p.color[0]} ${p.color[1]} ${p.color[2]})`,.55);
      }
      if(p.type==='mortar') createParticles(hx,hy,16,'#ff8800',1);
    } else {
      p.x+=dx/d*step; p.y+=dy/d*step;
      state.projectiles[pw++]=p;
    }
  }
  state.projectiles.length=pw;

  // Particles (in-place)
  let parw=0;
  for(let i=0;i<state.particles.length;i++){
    const pt=state.particles[i];
    pt.life-=dt; if(pt.life<=0)continue;
    pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vx*=.97; pt.vy*=.97; pt.vy+=38*dt;
    state.particles[parw++]=pt;
  }
  state.particles.length=parw;

  // Floating texts (in-place)
  let txw=0;
  for(let i=0;i<state.texts.length;i++){
    const t2=state.texts[i];
    t2.life-=dt; if(t2.life<=0)continue;
    t2.y-=26*dt;
    state.texts[txw++]=t2;
  }
  state.texts.length=txw;

  // Enemies (in-place; dead ones drop out)
  let enw=0;
  for(let i=0;i<state.enemies.length;i++){
    if(state.enemies[i].alive) state.enemies[enw++]=state.enemies[i];
  }
  state.enemies.length=enw;

  // Drop stale global focus if the marked enemy died or leaked
  if(state.priorityTargetId&&!state.enemies.some(e=>e.id===state.priorityTargetId&&e.alive)) state.priorityTargetId=null;

  state.shake=Math.max(0,state.shake-dt*7);
}

/* ═══════════════════════════════════════════════════════════
   RENDERING
   ═══════════════════════════════════════════════════════════ */
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const bgCanvas=document.getElementById('bgCanvas');
const bgCtx=bgCanvas.getContext('2d');

const MAX_RENDER_PIXELS=3.2e6;   // 画布像素预算：超过就自动降采样，保证大屏 / 触屏笔记本不掉帧
function renderDPR(w,h){
  const d=window.devicePixelRatio||1;
  if(!w||!h) return Math.min(d,2);
  return Math.max(1,Math.min(d,2,Math.sqrt(MAX_RENDER_PIXELS/(w*h))));
}

function fitBoard(){
  const box=document.getElementById('canvasBox'); const rect=box.getBoundingClientRect();
  const vw=Math.max(2,rect.width), vh=Math.max(2,rect.height);
  const dpr=renderDPR(vw,vh);
  canvas.width=Math.max(2,Math.floor(vw*dpr)); canvas.height=Math.max(2,Math.floor(vh*dpr));
  bgCanvas.width=canvas.width; bgCanvas.height=canvas.height;
  canvas.style.width='100%'; canvas.style.height='100%';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  bgCtx.setTransform(dpr,0,0,dpr,0,0);
  invalidateBackground();
  const old={...state.board};
  invalidatePathPixelCache();
  // Fixed reference cell size — always computed against the game's original 12x9
  // grid, regardless of the actual map's gridW/gridH. Custom maps never shrink
  // cells to fit; oversized maps scroll via a camera + minimap instead.
  const cell=clamp(Math.floor(Math.min(vw/12,vh/9)),38,76);
  const bw=cell*GRID_W,bh=cell*GRID_H;
  const camX=Math.max(0,bw-vw), camY=Math.max(0,bh-vh);
  state.camera.needsCam=camX>0||camY>0;
  state.camera.x=clamp(state.camera.x,0,camX);
  state.camera.y=clamp(state.camera.y,0,camY);
  if(!state.camera.needsCam){ state.camera.x=0; state.camera.y=0; }
  // Center the board on any axis that fits; pan only on overflowing axes.
  const nx=camX>0?-state.camera.x:Math.floor((vw-bw)/2);
  const ny=camY>0?-state.camera.y:Math.floor((vh-bh)/2);
  state.board={x:nx,y:ny,w:bw,h:bh,cell,viewW:vw,viewH:vh};
  if(old.cell&&old.cell!==cell) rescalePixelEntities(old,state.board);
  else if(old.cell) translatePixelEntities(nx-old.x,ny-old.y);
  syncAllEnemyPositions();
  invalidateBackground();
  updateMiniMapVisibility();
  if(state.buildCell) layoutWheel();
}

/* Recomputes state.board.x/y from the current camera position (clamped to the
   map's bounds) WITHOUT re-measuring the viewport or resizing the canvas —
   cheap enough to call on every pan/drag/keystroke. */
function updateCameraOffset(){
  invalidatePathPixelCache();
  const b=state.board;
  const oldX=b.x, oldY=b.y;
  const camX=Math.max(0,b.w-b.viewW), camY=Math.max(0,b.h-b.viewH);
  state.camera.needsCam=camX>0||camY>0;
  state.camera.x=clamp(state.camera.x,0,camX);
  state.camera.y=clamp(state.camera.y,0,camY);
  b.x=camX>0?-state.camera.x:Math.floor((b.viewW-b.w)/2);
  b.y=camY>0?-state.camera.y:Math.floor((b.viewH-b.h)/2);
  const dx=b.x-oldX, dy=b.y-oldY;
  if(dx||dy){
    shiftWorldEntities(dx,dy);
    syncAllEnemyPositions();
    invalidateBackground();
  }
}

/* Enemies derive their position from path distance, so only pixel-space
   effects need shifting here. */
function shiftWorldEntities(dx,dy){ translatePixelEntities(dx,dy); }

function translatePixelEntities(dx,dy){
  if(!dx&&!dy)return;
  for(const p of state.projectiles){
    p.x+=dx; p.y+=dy; p.tx+=dx; p.ty+=dy;
    if(p.trail) for(const pt of p.trail){ pt[0]+=dx; pt[1]+=dy; }
  }
  for(const pt of state.particles){ pt.x+=dx; pt.y+=dy; }
  for(const t of state.texts){ t.x+=dx; t.y+=dy; }
  for(const t of state.towers){ if(t.laserBeam){ t.laserBeam.sx+=dx; t.laserBeam.sy+=dy; t.laserBeam.tx+=dx; t.laserBeam.ty+=dy; } }
}

/* Canvas resize with a different cell size: scale every pixel-space effect
   (and its target point) around the old board origin. Enemies re-derive. */
function rescalePixelEntities(old,now){
  const s=old.cell?now.cell/old.cell:1;
  const fx=x=>now.x+(x-old.x)*s, fy=y=>now.y+(y-old.y)*s;
  for(const p of state.projectiles){
    p.x=fx(p.x); p.y=fy(p.y); p.tx=fx(p.tx); p.ty=fy(p.ty);
    if(p.trail) for(const pt of p.trail){ pt[0]=fx(pt[0]); pt[1]=fy(pt[1]); }
  }
  for(const pt of state.particles){ pt.x=fx(pt.x); pt.y=fy(pt.y); }
  for(const t of state.texts){ t.x=fx(t.x); t.y=fy(t.y); }
  for(const t of state.towers){ t.laserBeam=null; }
}

/* ═══════════════════════════════════════════════════════════
   MINIMAP — only shown for maps whose grid is larger than the
   viewport (state.camera.needsCam). Freely draggable & resizable;
   drag-to-navigate logic adapted from the reference file.
   ═══════════════════════════════════════════════════════════ */
const miniMapEl=document.getElementById('gameMiniMap');
const miniMapCanvas=document.getElementById('miniMapCanvas');
const miniMapCtx=miniMapCanvas.getContext('2d');

function updateMiniMapVisibility(){
  if(!state.camera.needsCam){ miniMapEl.style.display='none'; return; }
  miniMapEl.style.display='block';
  const boxRect=document.getElementById('canvasBox').getBoundingClientRect();
  const mm=state.miniMap;
  if(mm.x==null){ mm.x=Math.max(8,boxRect.width-mm.w-16); mm.y=Math.max(8,boxRect.height-mm.h-16); }
  mm.x=clamp(mm.x,0,Math.max(0,boxRect.width-mm.w));
  mm.y=clamp(mm.y,0,Math.max(0,boxRect.height-mm.h));
  miniMapEl.style.left=mm.x+'px'; miniMapEl.style.top=mm.y+'px'; miniMapEl.style.width=mm.w+'px';
  const headerH=miniMapEl.querySelector('.miniHeader').offsetHeight||20;
  const cH=Math.max(60,mm.h-headerH);
  if(miniMapCanvas.width!==mm.w||miniMapCanvas.height!==cH){ miniMapCanvas.width=mm.w; miniMapCanvas.height=cH; }
}

let _miniMapAt=0;
function drawMiniMap(){
  if(!state.camera.needsCam||miniMapEl.style.display==='none')return;
  const now=performance.now();
  if(now-_miniMapAt<130) return;
  _miniMapAt=now;
  const w=miniMapCanvas.width,h=miniMapCanvas.height;
  const b=state.board;
  const sx=w/b.w, sy=h/b.h;
  const mctx=miniMapCtx;
  mctx.clearRect(0,0,w,h);
  mctx.fillStyle='rgba(8,13,22,.92)'; mctx.fillRect(0,0,w,h);
  const mp=currentMap();
  mctx.strokeStyle='rgba(180,180,180,.55)'; mctx.lineWidth=Math.max(2,b.cell*sx*.45); mctx.lineJoin='round'; mctx.lineCap='round';
  for(const route of mapRoutesOf(mp)){
    mctx.beginPath();
    route.forEach(([x,y],i)=>{ const px=(x+.5)*b.cell*sx, py=(y+.5)*b.cell*sy; i?mctx.lineTo(px,py):mctx.moveTo(px,py); });
    mctx.stroke();
  }
  for(const t of state.tunnels){
    const e=pointAtDistance(t.entryD,t.route);
    mctx.fillStyle='#c98b52';
    mctx.beginPath(); mctx.arc((e.x*b.cell)*sx,(e.y*b.cell)*sy,2.6,0,Math.PI*2); mctx.fill();
    if(t.status==='open'){
      const x=pointAtDistance(t.exitD,t.route);
      mctx.beginPath(); mctx.arc((x.x*b.cell)*sx,(x.y*b.cell)*sy,2.6,0,Math.PI*2); mctx.fill();
    }
  }
  for(const t of state.towers){
    const c=towerCenterPx(t);
    mctx.fillStyle=t.type==='superLaser'?'#00f0ff':'#7dffbb';
    mctx.beginPath(); mctx.arc((c.x-b.x)*sx,(c.y-b.y)*sy,2.3,0,Math.PI*2); mctx.fill();
  }
  for(const en of state.enemies){
    if(!en.alive||en.inTunnel)continue;
    mctx.fillStyle=en.boss?'#ffd36b':'#fb7185';
    mctx.beginPath(); mctx.arc((en.x-b.x)*sx,(en.y-b.y)*sy,en.boss?3.2:1.8,0,Math.PI*2); mctx.fill();
  }
  const basePos=basePosition();
  mctx.fillStyle='#4ade80';
  mctx.beginPath(); mctx.arc((basePos.x-b.x)*sx,(basePos.y-b.y)*sy,3.6,0,Math.PI*2); mctx.fill();
  mctx.strokeStyle='#fff'; mctx.lineWidth=2;
  const vx=clamp(-b.x,0,b.w), vy=clamp(-b.y,0,b.h);
  const vw2=Math.max(0,Math.min(b.viewW,b.w-vx)), vh2=Math.max(0,Math.min(b.viewH,b.h-vy));
  mctx.strokeRect(vx*sx,vy*sy,vw2*sx,vh2*sy);
}

function moveCameraByMini(mx,my){

  state.camera.x=worldX-b.viewW/2; state.camera.y=worldY-b.viewH/2;
  updateCameraOffset();
}

// Deterministic decoration placement (seeded by map id)
function mapDecorations(mp){
  const ps=pathSet(); const result=[];
  let seed=mp.id.split('').reduce((a,c)=>a*31+c.charCodeAt(0),1);
  const rng=()=>{ seed=(seed*1664525+1013904223)&0xffffffff; return (seed>>>0)/0xffffffff; };
  for(let y=0;y<GRID_H;y++) for(let x=0;x<GRID_W;x++){
    if(ps.has(`${x},${y}`))continue;
    const r=rng(); if(r<.28) result.push({x,y,t:r,r2:rng(),r3:rng()});
  }
  return result;
}
const decoCache=new Map();
function getDecos(mp){ if(!decoCache.has(mp.id)) decoCache.set(mp.id,mapDecorations(mp)); return decoCache.get(mp.id); }

function drawDeco(c,mp,deco,cell){
  const px=state.board.x+deco.x*cell+cell*.5, py=state.board.y+deco.y*cell+cell*.5;
  if(state.towers.some(t=>towerOccupiesCell(t,deco.x,deco.y)))return;
  c.save();
  if(mp.deco==='forest'){
    const sz=8+deco.r2*8; const angle=deco.r3*Math.PI*2;
    c.translate(px,py); c.rotate(angle);
    if(deco.t<.14){ // tree
      c.fillStyle=`rgba(${30+deco.r2*20},${100+deco.r2*50},${40+deco.r2*20},.72)`;
      c.beginPath(); c.moveTo(0,-sz*1.3); c.lineTo(-sz*.75,sz*.55); c.lineTo(sz*.75,sz*.55); c.closePath(); c.fill();
      c.fillStyle=`rgba(${20+deco.r2*10},${70+deco.r2*30},${30},.85)`;
      c.fillRect(-sz*.18,sz*.55,sz*.36,sz*.55);
    } else { // rock
      c.fillStyle=`rgba(60,80,70,.42)`;
      c.beginPath(); c.ellipse(0,0,sz*.7,sz*.55,0,0,Math.PI*2); c.fill();
    }
  } else if(mp.deco==='desert'){
    const sz=7+deco.r2*7;
    c.translate(px,py);
    if(deco.t<.10){ // cactus
      c.fillStyle=`rgba(60,120,40,.65)`; c.fillRect(-sz*.22,-sz*1.2,sz*.44,sz*1.6);
      c.fillRect(-sz*.7,-sz*.3,sz*.5,sz*.24); c.fillRect(sz*.22,-sz*.25,sz*.5,sz*.24);
    } else { // rock/sand
      c.fillStyle=`rgba(140,100,60,.28)`;
      c.beginPath(); c.ellipse(0,0,sz*.9,sz*.55,deco.r3*Math.PI,0,Math.PI*2); c.fill();
    }
  } else if(mp.deco==='ice'){
    const sz=7+deco.r2*9;
    c.translate(px,py); c.rotate(deco.r3*Math.PI*.5);
    c.fillStyle=`rgba(140,200,255,.22)`;
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3; c.beginPath(); c.moveTo(0,0);
      c.lineTo(Math.cos(a)*sz,Math.sin(a)*sz); c.lineTo(Math.cos(a+Math.PI/18)*sz*.6,Math.sin(a+Math.PI/18)*sz*.6);
      c.closePath(); c.fill();
    }
  } else if(mp.deco==='volcano'){
    const sz=8+deco.r2*9;
    c.translate(px,py);
    if(deco.t<.12){ // lava rock
      c.fillStyle=`rgba(180,50,20,.38)`;
      c.beginPath(); c.ellipse(0,0,sz*.8,sz*.6,deco.r3*Math.PI,0,Math.PI*2); c.fill();
      c.fillStyle=`rgba(255,80,10,.18)`;
      c.beginPath(); c.arc(0,0,sz*.35,0,Math.PI*2); c.fill();
    } else {
      c.fillStyle=`rgba(100,30,10,.25)`;
      c.beginPath(); c.arc(0,0,sz*.6,0,Math.PI*2); c.fill();
    }
  }
  c.restore();
}

/* Static scenery is expensive (grid + path glow + decorations) and only changes
   when the map, camera or canvas size changes — so it is rendered once into an
   offscreen canvas and blitted each frame. */
let bgCache={ canvas:null, ctx:null, key:'' };
function invalidateBackground(){ bgCache.key=''; }
function bgKey(){
  const b=state.board;
  return [currentMap().id,b.x,b.y,b.cell,canvas.width,canvas.height,state.towersRev].join('|');
}
function drawBackgroundCached(){
  const w=canvas.clientWidth,h=canvas.clientHeight,dpr=renderDPR(w,h);
  const key=bgKey();
  if(bgCache.key===key) return;          // 只有地图/镜头/尺寸变化时才重绘背景层
  const cw=Math.max(2,Math.floor(w*dpr)), ch=Math.max(2,Math.floor(h*dpr));
  if(bgCanvas.width!==cw||bgCanvas.height!==ch){ bgCanvas.width=cw; bgCanvas.height=ch; }
  const c=bgCtx;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,w,h);
  drawBackground(c,w,h);
  bgCache.key=key;
}

function tileHash(x,y,salt){
  let h=(x*374761393+y*668265263+(salt||0)*2246822519)^0x9e3779b9;
  h=(h^(h>>>13))*1274126177; h^=h>>>16;
  return (h>>>0)/4294967296;
}

function drawBackground(c,w,h){
  const m=currentMap();
  const g=c.createLinearGradient(0,0,w,h);
  g.addColorStop(0,m.theme[0]); g.addColorStop(.45,m.theme[1]); g.addColorStop(1,m.theme[2]);
  c.fillStyle=g; c.fillRect(0,0,w,h);

  // 星云光斑（静态缓存，给深空一点层次）
  const neb=[['rgba(80,200,255,.10)',0.16,0.22,0.55],['rgba(160,110,255,.09)',0.78,0.32,0.5],['rgba(90,255,190,.06)',0.5,0.92,0.6]];
  for(const [col,nx,ny,nr] of neb){
    const cx=w*nx, cy=h*ny, rad=Math.max(w,h)*nr;
    const rg=c.createRadialGradient(cx,cy,0,cx,cy,rad);
    rg.addColorStop(0,col); rg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=rg; c.fillRect(0,0,w,h);
  }

  // Stars (static — the background is cached)
  for(let i=0;i<70;i++){
    const sx=(i*181+7)%w, sy=(i*97+13)%h;
    c.globalAlpha=i%7===0?.20:.08; c.fillStyle=i%5===0?'#b8ffff':'#ffffff';
    c.beginPath(); c.arc(sx,sy,i%3?1.1:1.8,0,Math.PI*2); c.fill();
  }
  c.globalAlpha=1;

  const ps=pathSet(); const cell=state.board.cell;
  const b=state.board;

  // ── 地面：每格微差色 + 细碎纹理，避免大片纯色 ──
  for(let y=0;y<GRID_H;y++) for(let x=0;x<GRID_W;x++){
    const px=b.x+x*cell, py=b.y+y*cell;
    if(!ps.has(`${x},${y}`)){
      c.fillStyle=(x+y)%2===0?m.grassA:m.grassB;
      c.fillRect(px,py,cell,cell);
      const r1=tileHash(x,y,m.id.length), r2=tileHash(x,y,m.id.length+7);
      c.fillStyle=`rgba(255,255,255,${.012+r1*.022})`;
      c.fillRect(px,py,cell,cell);
      if(r2>.55){ // 碎石/苔点
        c.fillStyle=`rgba(${r1>.5?'190,240,255':'120,200,160'},${.05+r2*.06})`;
        const dx=px+cell*(.18+r1*.6), dy=py+cell*(.18+tileHash(y,x,3)*.6);
        c.beginPath(); c.arc(dx,dy,cell*(.018+r2*.022),0,Math.PI*2); c.fill();
      }
      c.strokeStyle='rgba(255,255,255,.035)'; c.lineWidth=1;
      c.strokeRect(px+.5,py+.5,cell-1,cell-1);
    }
  }

  // ── 道路：每条路线一条连续的圆角带子，多出生点地图会画出多条 ──
  const routePts=allRoutePointsPx();
  for(const pts of routePts){
    if(pts.length<2) continue;
    const path=()=>{ c.beginPath(); pts.forEach((p,k)=>k?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)); };
    c.save();
    c.lineJoin='round'; c.lineCap='round';
    c.strokeStyle='rgba(0,0,0,.38)'; c.lineWidth=cell*1.0; path(); c.stroke();
    const roadGrad=c.createLinearGradient(pts[0].x,pts[0].y,pts[pts.length-1].x,pts[pts.length-1].y);
    roadGrad.addColorStop(0,m.roadFill); roadGrad.addColorStop(.5,m.roadEdge.replace(/\.4\)$/, '.85)')); roadGrad.addColorStop(1,m.roadFill);
    c.strokeStyle=roadGrad; c.lineWidth=cell*.86; path(); c.stroke();
    c.strokeStyle='rgba(0,0,0,.16)'; c.lineWidth=cell*.54; path(); c.stroke();
    c.strokeStyle='rgba(255,255,255,.055)'; c.lineWidth=cell*.42; path(); c.stroke();
    // 方向箭头
    c.fillStyle='rgba(255,255,255,.26)';
    let acc=0;
    for(let k=1;k<pts.length;k++){
      const a=pts[k-1], d=pts[k];
      const len=Math.hypot(d.x-a.x,d.y-a.y)||1;
      acc+=len;
      if(acc<cell*1.8) continue;
      acc=0;
      const ux=(d.x-a.x)/len, uy=(d.y-a.y)/len;
      const mx=d.x-ux*cell*.35, my=d.y-uy*cell*.35;
      const sz=cell*.085;
      c.beginPath();
      c.moveTo(mx+ux*sz*1.5,my+uy*sz*1.5);
      c.lineTo(mx-ux*sz+uy*sz,my-uy*sz-ux*sz);
      c.lineTo(mx-ux*sz-uy*sz,my-uy*sz+ux*sz);
      c.closePath(); c.fill();
    }
    c.restore();
  }
  // 道路格分缝：让“路”仍然读得出格子边界
  c.strokeStyle='rgba(0,0,0,.12)'; c.lineWidth=1;
  for(const key of ps){ const [x,y]=key.split(',').map(Number); const px=b.x+x*cell, py=b.y+y*cell; c.strokeRect(px+.5,py+.5,cell-1,cell-1); }

  // ── 起点传送门（多路线时每条线一个） ──
  routePts.forEach((pts,ri)=>{
    const start=pts[0]; if(!start) return;
    c.save();
    const ring=c.createRadialGradient(start.x,start.y,2,start.x,start.y,cell*.52);
    ring.addColorStop(0,'rgba(230,255,245,.9)'); ring.addColorStop(.35,'rgba(74,222,128,.65)');
    ring.addColorStop(.7,'rgba(40,180,140,.18)'); ring.addColorStop(1,'rgba(20,80,60,0)');
    c.fillStyle=ring; c.beginPath(); c.arc(start.x,start.y,cell*.52,0,Math.PI*2); c.fill();
    c.strokeStyle='rgba(160,255,210,.5)'; c.lineWidth=1.4;
    for(const rr of [cell*.26,cell*.36]){ c.beginPath(); c.arc(start.x,start.y,rr,0,Math.PI*2); c.stroke(); }
    c.fillStyle='rgba(4,30,20,.85)'; c.beginPath(); c.arc(start.x,start.y,cell*.17,0,Math.PI*2); c.fill();
    c.fillStyle='rgba(235,255,245,.95)'; c.font=`700 ${clamp(cell*.16,9,14)}px system-ui`;
    c.textAlign='center'; c.textBaseline='middle'; c.fillText('出',start.x,start.y);
    c.restore();
  });

  // ── 基地平台 ──
  const bpos=routePts[0]?routePts[0][routePts[0].length-1]:null;
  if(bpos){
    c.save();
    const pad=c.createRadialGradient(bpos.x,bpos.y,2,bpos.x,bpos.y,cell*.62);
    pad.addColorStop(0,'rgba(255,220,140,.30)'); pad.addColorStop(.65,'rgba(120,90,40,.16)'); pad.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=pad; c.beginPath(); c.arc(bpos.x,bpos.y,cell*.62,0,Math.PI*2); c.fill();
    c.strokeStyle='rgba(255,211,107,.42)'; c.lineWidth=1.4; c.setLineDash([cell*.16,cell*.12]);
    c.beginPath(); c.arc(bpos.x,bpos.y,cell*.42,0,Math.PI*2); c.stroke();
    c.restore();
  }

  // ── 装饰 ──
  for(const d of getDecos(m)) drawDeco(c,m,d,cell);

  // ── 地图边框与暗角 ──
  c.save();
  c.strokeStyle='rgba(0,0,0,.45)'; c.lineWidth=3;
  c.strokeRect(b.x-2,b.y-2,b.w+4,b.h+4);
  c.strokeStyle=`${m.accentColor||'#6ee7ff'}55`; c.lineWidth=1.4;
  c.strokeRect(b.x-1,b.y-1,b.w+2,b.h+2);
  // 四角括号
  const L=cell*.7, col=m.accentColor||'#6ee7ff';
  c.strokeStyle=col; c.lineWidth=3; c.globalAlpha=.75;
  const corners=[[b.x,b.y,1,1],[b.x+b.w,b.y,-1,1],[b.x,b.y+b.h,1,-1],[b.x+b.w,b.y+b.h,-1,-1]];
  for(const [cx,cy,sx,sy] of corners){
    c.beginPath(); c.moveTo(cx+sx*L,cy); c.lineTo(cx,cy); c.lineTo(cx,cy+sy*L); c.stroke();
  }
  c.globalAlpha=1;
  const vg=c.createRadialGradient(b.x+b.w/2,b.y+b.h/2,Math.min(b.w,b.h)*.34,b.x+b.w/2,b.y+b.h/2,Math.max(b.w,b.h)*.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.30)');
  c.fillStyle=vg; c.fillRect(b.x,b.y,b.w,b.h);
  c.restore();

  // Map name badge (compact, so it doesn't hide the battlefield)
  c.save();
  const nameFont=`700 ${clamp(cell*.26,12,17)}px system-ui`;
  c.font=nameFont;
  const nameW=c.measureText(m.name).width;
  const plateX=b.x+10, plateY=b.y+8;
  c.fillStyle='rgba(4,10,18,.55)';
  c.beginPath(); c.roundRect(plateX-6,plateY-4,nameW+20,26,9); c.fill();
  c.strokeStyle='rgba(255,255,255,.10)'; c.lineWidth=1; c.stroke();
  c.fillStyle='rgba(255,255,255,.88)'; c.textAlign='left'; c.textBaseline='middle';
  c.fillText(m.name,plateX+4,plateY+9);
  c.restore();
}

function drawBase(){
  const bpos=basePosition(); const b=state.base; const pct=b.hp/b.maxHp;
  const t=performance.now()/1000; const pulse=1+Math.sin(t*1.8)*.05;
  const col=pct>.6?'#ffd36b':pct>.3?'#ff9f43':'#ff6b6b';
  ctx.save();
  ctx.translate(bpos.x,bpos.y); ctx.scale(pulse,pulse);
  ctx.shadowBlur=18; ctx.shadowColor=pct>.5?'rgba(255,211,107,.5)':'rgba(255,80,80,.5)';
  // Outer ring
  ctx.strokeStyle=col; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.stroke();
  // Inner fill
  const g=ctx.createRadialGradient(0,0,4,0,0,20);
  g.addColorStop(0,'rgba(255,240,180,.9)'); g.addColorStop(.5,col+'cc'); g.addColorStop(1,'rgba(20,14,6,.9)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,19,0,Math.PI*2); ctx.fill();
  // Castle icon
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='bold 16px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🏰',0,0);
  ctx.restore();
  // HP bar above base
  const bw=52; const bx=bpos.x-bw/2,by=bpos.y-34;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.5)'; roundRect(ctx,bx-1,by-1,bw+2,9,4); ctx.fill();
  ctx.fillStyle=pct>.6?'#4ade80':pct>.3?'#fbbf24':'#f87171';
  roundRect(ctx,bx,by,bw*pct,7,3.5); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='10px system-ui'; ctx.textAlign='center';
  ctx.fillText(`Lv.${b.level}  ${Math.ceil(b.hp)}/${b.maxHp}`,bpos.x,by-5);
  ctx.restore();
}

function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

function hexPath(ctx,cx,cy,r){
  ctx.beginPath();
  for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;i?ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}
  ctx.closePath();
}

function drawSuperLaser(t){
  const cell=state.board.cell;
  const cx=state.board.x+(t.x+1)*cell, cy=state.board.y+(t.y+1)*cell;
  const sz=cell*0.88;
  const sel=state.selectedTowerId===t.id;
  const time=performance.now()/1000;
  const charge=Math.max(0,1-t.cooldown/SUPERLASER_COOLDOWN);
  const target=t.targetId?state.enemies.find(e=>e.id===t.targetId&&e.alive):null;
  const aimAngle=t.facingAngle??Math.PI/2;

  ctx.save(); ctx.translate(cx,cy); ctx.scale(towerSpawnScale(t),towerSpawnScale(t));

  /* ── Laser beam (drawn first, behind everything) ── */
  if(t.laserBeam&&t.laserBeam.life>0){
    const bl=t.laserBeam, a=bl.life/bl.maxLife;
    const dx2=bl.tx-cx,dy2=bl.ty-cy,len=Math.hypot(dx2,dy2),ang=Math.atan2(dy2,dx2);
    ctx.save(); ctx.rotate(ang);
    // Wide outer corona
    const lg=ctx.createLinearGradient(0,0,len,0);
    lg.addColorStop(0,`rgba(0,240,255,${a*.9})`); lg.addColorStop(.45,`rgba(200,255,255,${a})`); lg.addColorStop(1,'rgba(0,240,255,0)');
    ctx.shadowBlur=50; ctx.shadowColor='rgba(0,240,255,.9)';
    ctx.strokeStyle=lg; ctx.lineWidth=26; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(sz*.2,0); ctx.lineTo(len,0); ctx.stroke();
    // Mid glow
    ctx.strokeStyle=`rgba(160,255,255,${a*.8})`; ctx.lineWidth=12; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.moveTo(sz*.2,0); ctx.lineTo(len,0); ctx.stroke();
    // Core white
    ctx.strokeStyle=`rgba(255,255,255,${a})`; ctx.lineWidth=3.5; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.moveTo(sz*.2,0); ctx.lineTo(len,0); ctx.stroke();
    ctx.restore();
  }

  /* ── Hexagonal platform ── */
  ctx.shadowBlur=sel?32:20;
  ctx.shadowColor=charge>.8?'rgba(0,240,255,.9)':'rgba(0,160,200,.5)';
  hexPath(ctx,0,0,sz*.92);
  ctx.fillStyle='rgba(8,18,34,.95)'; ctx.fill();
  ctx.strokeStyle=sel?'rgba(0,240,255,.95)':'rgba(0,200,220,.55)';
  ctx.lineWidth=2.5; ctx.stroke();
  // Inner hex ring
  ctx.shadowBlur=0; ctx.strokeStyle=`rgba(0,240,255,${.12+charge*.15})`; ctx.lineWidth=1.2;
  hexPath(ctx,0,0,sz*.72); ctx.stroke();

  /* ── Real charge progress ring (sweeps clockwise from top as it charges) ── */
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,sz*.99,-Math.PI/2,Math.PI*1.5,false); ctx.stroke();
  if(charge>0.001){
    ctx.strokeStyle=charge>=1?'rgba(125,255,187,.95)':'rgba(0,230,255,.9)';
    ctx.shadowBlur=charge>=1?16:8; ctx.shadowColor=ctx.strokeStyle;
    ctx.beginPath(); ctx.arc(0,0,sz*.99,-Math.PI/2,-Math.PI/2+Math.PI*2*charge,false); ctx.stroke();
  }
  ctx.restore();

  /* ── Rotating energy rings ── */
  for(let r=0;r<3;r++){
    const rs=sz*(.38+r*.13); const ra=-time*(1.4-r*.4)+(r*Math.PI/3);
    ctx.save(); ctx.rotate(ra);
    ctx.strokeStyle=`rgba(0,${160+r*30},${220+r*12},${.14+charge*.22})`;
    ctx.lineWidth=1.8+r*.4; ctx.setLineDash([rs*.42,rs*.28]);
    ctx.beginPath(); ctx.arc(0,0,rs,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }

  /* ── Core energy orb ── */
  ctx.shadowBlur=charge>0.6?28:12; ctx.shadowColor=`rgba(0,240,255,${charge*.8})`;
  const cg=ctx.createRadialGradient(-sz*.07,-sz*.07,sz*.03,0,0,sz*.28);
  cg.addColorStop(0,'rgba(255,255,255,.96)'); cg.addColorStop(.38,`rgba(${80+charge*140},${200+charge*55},255,.92)`); cg.addColorStop(1,'rgba(0,60,120,.9)');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(0,0,sz*.26,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=`rgba(0,240,255,${.5+charge*.4})`; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(0,0,sz*.2,0,Math.PI*2); ctx.stroke();

  /* ── Twin barrel assembly ── */
  ctx.save(); ctx.rotate(aimAngle); ctx.shadowBlur=0;
  const bw=sz*.15, bh=sz*.68;
  for(const side of[-1,1]){
    const bx2=side*(sz*.19);
    // Barrel body gradient
    const bg=ctx.createLinearGradient(bx2-bw*.5,0,bx2+bw*.5,0);
    bg.addColorStop(0,'rgba(5,15,30,.98)'); bg.addColorStop(.4,`rgba(${30+charge*50},${120+charge*80},${160+charge*60},.9)`); bg.addColorStop(1,'rgba(5,15,30,.98)');
    ctx.fillStyle=bg; ctx.beginPath(); ctx.roundRect(bx2-bw*.5,-bh,bw,bh,4); ctx.fill();
    ctx.strokeStyle=`rgba(0,${180+charge*60},${220+charge*30},.7)`; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.roundRect(bx2-bw*.5,-bh,bw,bh,4); ctx.stroke();
    // Energy coil bands
    for(let i=1;i<5;i++){
      const cy2=-bh*(.15+i*.18);
      ctx.strokeStyle=`rgba(0,${190+charge*50},255,${.25+charge*.35})`;
      ctx.lineWidth=2.2; ctx.beginPath(); ctx.arc(bx2,cy2,bw*.6,0,Math.PI*2); ctx.stroke();
    }
    // Muzzle glow
    const mg=ctx.createRadialGradient(bx2,-bh,1,bx2,-bh,sz*.14);
    mg.addColorStop(0,`rgba(255,255,255,${charge*.7})`); mg.addColorStop(.4,`rgba(0,240,255,${charge*.5})`); mg.addColorStop(1,'rgba(0,240,255,0)');
    ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(bx2,-bh,sz*.14,0,Math.PI*2); ctx.fill();
    // Muzzle cap
    ctx.fillStyle=`rgba(0,${210+charge*45},255,${.6+charge*.3})`;
    ctx.beginPath(); ctx.arc(bx2,-bh,sz*.055,0,Math.PI*2); ctx.fill();
  }
  // Center spine between barrels
  const sg=ctx.createLinearGradient(-sz*.05,-bh*.8,sz*.05,-bh*.8);
  sg.addColorStop(0,'rgba(0,200,230,.08)'); sg.addColorStop(.5,'rgba(0,240,255,.65)'); sg.addColorStop(1,'rgba(0,200,230,.08)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.roundRect(-sz*.045,-bh*.78,sz*.09,bh*.42,2); ctx.fill();
  // Muzzle bridge
  ctx.fillStyle=`rgba(0,${170+charge*70},${210+charge*40},.8)`;
  ctx.beginPath(); ctx.roundRect(-sz*.21-bw*.4,-bh-sz*.04,sz*.42+bw*.8,sz*.055,3); ctx.fill();
  ctx.restore(); // aimAngle

  /* ── MAX badge ── */
  ctx.fillStyle='rgba(0,0,0,.82)'; ctx.beginPath(); ctx.arc(sz*.58,-sz*.58,11,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#00f0ff'; ctx.font='bold 8px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('MAX',sz*.58,-sz*.58);

  /* ── Targeting dashed line to current target ── */
  if(target&&!t.laserBeam){
    const dx2=target.x-cx,dy2=target.y-cy,len=Math.hypot(dx2,dy2);
    const a2=Math.atan2(dy2,dx2);
    ctx.save(); ctx.rotate(a2); ctx.strokeStyle='rgba(0,240,255,.22)'; ctx.lineWidth=1.5;
    ctx.setLineDash([7,7]); ctx.beginPath(); ctx.moveTo(sz*.95,0); ctx.lineTo(len-14,0); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(0,240,255,.4)';
    ctx.beginPath(); ctx.moveTo(len-6,0); ctx.lineTo(len-18,-5); ctx.lineTo(len-18,5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* ── No-target label ── */
  if(!target){
    ctx.fillStyle=`rgba(255,200,0,${.55+.45*Math.sin(time*2.2)})`;
    ctx.font='11px system-ui'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText('待机中',0,sz+6);
  }

  ctx.restore(); // translate

  /* ── Outer selection ring ── */
  if(sel){
    ctx.save(); ctx.strokeStyle='rgba(255,255,255,.82)'; ctx.lineWidth=2;
    ctx.setLineDash([6,5]); ctx.beginPath(); ctx.arc(cx,cy,sz+10,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }
}

function drawTower(t){
  const st=effectiveStats(t);
  const type=TOWER_TYPES[t.type]||TOWER_TYPES.cannon;
  const col=type.color||[255,255,255];
  const c=towerCenterPx(t); const sel=state.selectedTowerId===t.id;
  const cell=state.board.cell; const R=cell*.36;
  const glow=`rgba(${col[0]},${col[1]},${col[2]},.55)`;
  const pulse=1+Math.sin(performance.now()/240+t.level)*.02;
  const spawnScale=towerSpawnScale(t);
  const isMortar=t.type==='mortar', isLaser=t.type==='laser', isFrost=t.type==='frost';
  const recoil=t.flash>0?(t.flash/.12)*R*.18:0;
  ctx.save(); ctx.translate(c.x,c.y); ctx.scale(pulse*spawnScale,pulse*spawnScale);

  // ground shadow
  ctx.fillStyle='rgba(0,0,0,.38)';
  ctx.beginPath(); ctx.ellipse(0,R*.45,R*.95,R*.4,0,0,Math.PI*2); ctx.fill();

  // armored octagonal plate
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=Math.PI/8+i*Math.PI/4;
    const px=Math.cos(a)*R, py=Math.sin(a)*R;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
  const topR=Math.min(255,Math.round(col[0]*.32+16)), topG=Math.min(255,Math.round(col[1]*.32+22)), topB=Math.min(255,Math.round(col[2]*.32+34));
  const plate=ctx.createLinearGradient(0,-R,0,R);
  plate.addColorStop(0,`rgb(${topR},${topG},${topB})`);
  plate.addColorStop(.55,'rgb(17,25,40)');
  plate.addColorStop(1,'rgb(7,11,19)');
  ctx.fillStyle=plate;
  ctx.shadowBlur=sel?16:6; ctx.shadowColor=glow; ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},.9)`; ctx.lineWidth=1.8; ctx.stroke();

  // inner ring + level arc
  ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},.18)`; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,R*.72,0,Math.PI*2); ctx.stroke();
  const lvPct=Math.min(1,(t.level%10||10)/10);
  ctx.strokeStyle=`rgba(${Math.min(255,col[0]+40)},${Math.min(255,col[1]+40)},${Math.min(255,col[2]+40)},.95)`;
  ctx.lineWidth=2.4; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,R*.86,-Math.PI/2,-Math.PI/2+Math.PI*2*lvPct); ctx.stroke();

  // barrel
  ctx.rotate(t.facingAngle??Math.PI/2);
  const bw=R*(isMortar?.78:.62);
  const bl=R*(isMortar?1.0:1.28)-recoil;
  // rear counterweight
  ctx.fillStyle='rgba(6,10,18,.95)';
  ctx.beginPath(); ctx.roundRect(-bw*.78,R*.05,bw*1.56,R*.26,2); ctx.fill();
  ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},.55)`; ctx.lineWidth=1; ctx.stroke();
  const bar=ctx.createLinearGradient(-bw/2,0,bw/2,0);
  bar.addColorStop(0,'rgba(4,7,12,.9)');
  bar.addColorStop(.18,`rgb(${Math.round(col[0]*.85)},${Math.round(col[1]*.85)},${Math.round(col[2]*.85)})`);
  bar.addColorStop(.5,`rgb(${Math.min(255,col[0]+45)},${Math.min(255,col[1]+45)},${Math.min(255,col[2]+45)})`);
  bar.addColorStop(.82,`rgb(${Math.round(col[0]*.85)},${Math.round(col[1]*.85)},${Math.round(col[2]*.85)})`);
  bar.addColorStop(1,'rgba(4,7,12,.9)');
  ctx.fillStyle=bar;
  ctx.beginPath(); ctx.roundRect(-bw/2,-bl,bw,bl+R*.18,3); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth=1; ctx.stroke();

  // muzzle: type-specific tip
  if(isFrost){
    ctx.fillStyle='rgba(210,250,255,.95)';
    ctx.beginPath(); ctx.moveTo(0,-bl-R*.16); ctx.lineTo(bw*.5,-bl); ctx.lineTo(0,-bl+R*.14); ctx.lineTo(-bw*.5,-bl); ctx.closePath(); ctx.fill();
  }else if(isLaser){
    ctx.shadowBlur=12; ctx.shadowColor=`rgba(${col[0]},${col[1]},${col[2]},.9)`;
    ctx.fillStyle='rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.arc(0,-bl,bw*.32,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }else{
    ctx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},.95)`;
    ctx.beginPath(); ctx.roundRect(-bw*.62,-bl-3,bw*1.24,isMortar?7:5,2); ctx.fill();
  }

  // pivot cap
  ctx.fillStyle='rgb(9,14,24)';
  ctx.beginPath(); ctx.arc(0,0,R*.28,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},.85)`; ctx.lineWidth=1.4; ctx.stroke();
  ctx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},.9)`;
  ctx.beginPath(); ctx.arc(0,0,R*.09,0,Math.PI*2); ctx.fill();
  ctx.restore();

  if(sel){
    ctx.save(); ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1.8; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.arc(c.x,c.y,st.range*cell,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }
  if(t.flash>0){
    ctx.save(); ctx.globalAlpha=Math.min(1,t.flash/.12)*.75; ctx.fillStyle='#fff7c8';
    ctx.beginPath(); ctx.arc(c.x,c.y-R*1.5,5,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  if(t.level>1){
    ctx.save(); ctx.fillStyle='rgba(0,0,0,.72)';
    ctx.beginPath(); ctx.arc(c.x+R*.8,c.y-R*.8,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffd36b'; ctx.font='bold 9px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t.level,c.x+R*.8,c.y-R*.8); ctx.restore();
  }
}

function drawEnemy(e){
  const boss=!!e.boss; const r=e.radius||(boss?28:14);
  const col=boss?(e.bossColor||[255,209,107]):(e.color||[255,127,103]);
  const hpPct=clamp(e.hp/e.maxHp,0,1);
  const slowed=e.slowTimer>0;
  const baseRGB=`${col[0]},${col[1]},${col[2]}`;
  const light=`rgb(${Math.min(255,col[0]+45)},${Math.min(255,col[1]+45)},${Math.min(255,col[2]+45)})`;
  const dark=`rgb(${Math.round(col[0]*.42)},${Math.round(col[1]*.42)},${Math.round(col[2]*.42)})`;
  ctx.save(); ctx.translate(e.x,e.y);
  const pulse=1+Math.sin(performance.now()/160+e.progress*14)*(boss?.045:.025);
  ctx.scale(pulse,pulse);
  ctx.shadowBlur=boss?14:6; ctx.shadowColor=`rgba(${baseRGB},.5)`;
  const g=ctx.createLinearGradient(0,-r,0,r);
  g.addColorStop(0,light); g.addColorStop(.55,`rgb(${baseRGB})`); g.addColorStop(1,dark);
  ctx.fillStyle=g;
  if(e.typeId==='swarmling'){
    ctx.beginPath(); ctx.moveTo(0,-r*1.15); ctx.lineTo(r*.82,0); ctx.lineTo(0,r*1.15); ctx.lineTo(-r*.82,0); ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(6,10,18,.72)'; ctx.lineWidth=1.6; ctx.stroke();

  // highlight
  ctx.fillStyle='rgba(255,255,255,.16)';
  ctx.beginPath(); ctx.ellipse(-r*.3,-r*.42,r*.42,r*.26,-.5,0,Math.PI*2); ctx.fill();

  // eye + glint
  ctx.fillStyle='rgba(8,12,20,.82)';
  ctx.beginPath(); ctx.arc(r*.26,-r*.1,r*.24,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.beginPath(); ctx.arc(r*.32,-r*.18,r*.09,0,Math.PI*2); ctx.fill();

  // armor plating
  if((e.armor||0)>=.2){
    ctx.strokeStyle=`rgba(190,235,255,${.25+(e.armor||0)*.6})`; ctx.lineWidth=2;
    ctx.setLineDash([r*.5,r*.34]);
    ctx.beginPath(); ctx.arc(0,0,r+4,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
  if(e.invincible){
    ctx.strokeStyle='rgba(203,213,225,.85)'; ctx.lineWidth=2;
    ctx.setLineDash([r*.45,r*.28]);
    ctx.beginPath(); ctx.arc(0,0,r+6,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
  if(slowed){
    ctx.strokeStyle='rgba(150,235,255,.8)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(0,0,r+1.5,0,Math.PI*2); ctx.stroke();
  }
  if(e.hitFlash>0){
    ctx.globalAlpha=Math.min(.65,e.hitFlash/.14*.55);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  if(boss){
    ctx.strokeStyle=`rgba(${baseRGB},.85)`; ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.arc(0,0,r+5,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=e.rage?'rgba(255,70,110,.95)':'rgba(255,255,255,.35)';
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,r+11,-Math.PI/2,-Math.PI/2+Math.PI*1.4); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.92)'; ctx.font='15px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(e.icon||'👑',0,-r*.55);
  }
  ctx.restore();

  // HP bar
  const hw=boss?70:Math.max(24,Math.round(r*2.1));
  const bx2=e.x-hw/2, by2=e.y-r-13;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(bx2-1,by2-1,hw+2,5);
  ctx.fillStyle=boss?`rgb(${baseRGB})`:(hpPct<.35?'#fbbf24':slowed?'#67e8f9':'#fb7185');
  ctx.fillRect(bx2,by2,hw*hpPct,3);
  ctx.restore();
  if(boss&&e.bossTypeName){
    ctx.save(); ctx.fillStyle='rgba(255,255,255,.82)'; ctx.font='bold 10px system-ui'; ctx.textAlign='center';
    ctx.fillText(`${e.bossTypeName} ${Math.ceil(e.hp)}`,e.x,e.y-r-20); ctx.restore();
  }
  if(e.invincible){
    ctx.save(); ctx.fillStyle='rgba(226,232,240,.9)'; ctx.font='bold 10px system-ui'; ctx.textAlign='center';
    ctx.fillText('无敌',e.x,e.y-r-20); ctx.restore();
  }
  if(state.priorityTargetId===e.id){
    const t2=performance.now()/1000; const pr=r+8+Math.sin(t2*4)*2;
    ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(t2*1.8);
    ctx.strokeStyle='rgba(255,140,0,.95)'; ctx.lineWidth=2.4; ctx.shadowBlur=14; ctx.shadowColor='rgba(255,140,0,.7)';
    for(let i=0;i<4;i++){
      const a0=i*Math.PI/2;
      ctx.beginPath(); ctx.arc(0,0,pr,a0,a0+Math.PI/4); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawProjectile(p){
  const col=p.color;
  ctx.save(); ctx.shadowBlur=p.type==='laser'?10:7; ctx.shadowColor=`rgba(${col[0]},${col[1]},${col[2]},.6)`;
  if(p.trail.length>1){
    ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},.22)`;
    ctx.lineWidth=p.type==='laser'?5:p.type==='mortar'?4:3; ctx.lineCap='round';
    ctx.beginPath(); p.trail.forEach((pt,i)=>i?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1])); ctx.stroke();
  }
  const r=p.type==='laser'?4.5:p.type==='mortar'?5.5:p.isBase?4.2:4.2;
  const grd=ctx.createRadialGradient(p.x-2,p.y-2,1,p.x,p.y,r+3);
  grd.addColorStop(0,'rgba(255,255,255,.95)'); grd.addColorStop(.5,`rgb(${col[0]},${col[1]},${col[2]})`); grd.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill(); ctx.restore();
}

function drawParticle(pt){ const a=Math.max(0,Math.min(1,pt.life/pt.maxLife)); ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=pt.color; ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.size*(.7+(1-a)*.8),0,Math.PI*2); ctx.fill(); ctx.restore(); }
function drawText(t){
  const a=Math.max(0,Math.min(1,t.life/t.maxLife));
  ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=t.color;
  ctx.font=`${t.big?'800 18px':'bold 13px'} system-ui`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowBlur=t.big?6:3; ctx.shadowColor='rgba(0,0,0,.5)';
  ctx.fillText(t.text,t.x,t.y);
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════
   BUILD WHEEL — 点按空地时在格子旁边弹出一个半圆建造盘
   （类似《保卫萝卜》的建造轮盘）。建造不再依赖右侧预先选中
   的塔种，右侧列表只做炮台资料介绍。
   ═══════════════════════════════════════════════════════════ */
const wheelEl=document.getElementById('buildWheel');
const wheelItemsEl=document.getElementById('wheelItems');
const wheelDiscEl=document.getElementById('wheelDisc');
const wheelArcEl=document.getElementById('wheelArc');
const wheelCloseEl=document.getElementById('wheelClose');
const stageCardEl=document.getElementById('stageCard');

function buildableTowerKeys(){
  return Object.keys(TOWER_TYPES).filter(k=>!TOWER_TYPES[k].__modId||state.activeMods.has(TOWER_TYPES[k].__modId));
}

function layoutWheel(){
  if(!state.buildCell)return;
  const stageRect=stageCardEl.getBoundingClientRect();
  const cell=state.board.cell;
  const [gx,gy]=state.buildCell;
  const cr=canvas.getBoundingClientRect();
  const originX=stageRect.left+stageCardEl.clientLeft;
  const originY=stageRect.top+stageCardEl.clientTop;
  const relX=(cr.left-originX)+state.board.x+(gx+.5)*cell;
  const relY=(cr.top-originY)+state.board.y+(gy+.5)*cell;
  const w=stageRect.width,h=stageRect.height;
  const n=Math.max(1,wheelItemsEl.children.length);
  const firstItem=wheelItemsEl.children[0];
  const itemD=firstItem?Math.max(52,firstItem.offsetWidth||58):58;
  const itemR=itemD/2;
  const R=Math.min(clamp(cell*1.6,108,150),Math.max(96,h*.4));
  // 上/下半圆：上方空间不够就翻到下方
  const up=relY>=R+itemR+16;
  let cx=relX,cy=relY;
  if(w-R-itemR-8>R+itemR+8){ cx=clamp(relX,R+itemR+8,w-R-itemR-8); }
  cy = up ? Math.max(relY,R+itemR+16) : Math.min(relY,h-R-itemR-16);
  cy = clamp(cy,itemR+8,Math.max(itemR+8,h-itemR-8));
  wheelEl.style.left=cx+'px';
  wheelEl.style.top=cy+'px';
  const D=2*(R+34);
  wheelDiscEl.style.width=D+'px'; wheelDiscEl.style.height=D+'px';
  wheelDiscEl.style.left=(-D/2)+'px'; wheelDiscEl.style.top=(-D/2)+'px';
  wheelDiscEl.classList.toggle('up',up); wheelDiscEl.classList.toggle('down',!up);
  const A=2*R;
  wheelArcEl.style.width=A+'px'; wheelArcEl.style.height=A+'px';
  wheelArcEl.style.left=(-A/2)+'px'; wheelArcEl.style.top=(-A/2)+'px';
  wheelArcEl.classList.toggle('up',up); wheelArcEl.classList.toggle('down',!up);
  // 按按钮实际尺寸算张角，格子小、炮种多时自动摊开，避免按钮互相压住
  const needDeg=Math.min(178,((n*itemD*1.08)/R)*180/Math.PI);
  const spread=n<=1?0:Math.max(needDeg,Math.min(150,22*n+16));
  const base=up?-90:90;
  const start=base-spread/2;
  const step=n<=1?0:spread/(n-1);
  const items=[...wheelItemsEl.children];
  items.forEach((el,i)=>{
    const a=(start+step*i)*Math.PI/180;
    el.style.left=(Math.cos(a)*R).toFixed(1)+'px';
    el.style.top=(Math.sin(a)*R).toFixed(1)+'px';
  });
}

let wheelArmAt=0;   // 触屏的 pointerup 之后浏览器还会补发一次 click，
                    // 它可能正好落在刚出现的 ✕ 或炮台按钮上。开盘点后的一小段
                    // 时间内忽略这些合成点击，手指稍后再点仍然有效。
function openBuildWheel(gx,gy){
  const keys=buildableTowerKeys();
  if(!keys.length){ setMsg('当前没有可建造的炮台。'); return; }
  // 打开建造盘 = 回到“没有选中任何炮台”的状态，避免旧射程圈残留
  if(state.selectedTowerId!=null){ state.selectedTowerId=null; state.towersRev++; renderStatic(); }
  state.buildCell=[gx,gy];
  wheelItemsEl.innerHTML=keys.map((k,i)=>{
    const t=TOWER_TYPES[k];
    const col=t.color||[200,200,200];
    const rgb=`rgb(${col[0]},${col[1]},${col[2]})`;
    return `<button class="wheelItem" data-build="${k}" style="border-color:${rgb}99;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 1px ${rgb}22 inset;animation-delay:${i*16}ms">
      <span class="wiIcon">${t.icon||'⬡'}</span>
      <span class="wiName">${t.name}</span>
      <span class="wiCost">${t.cost}</span>
    </button>`;
  }).join('');
  layoutWheel();
  refreshWheelAffordability();
  wheelEl.classList.add('show');
  wheelArmAt=performance.now()+300;
  sfx('click');
}

function closeBuildWheel(){
  if(!state.buildCell)return;
  state.buildCell=null;
  wheelEl.classList.remove('show');
}

function refreshWheelAffordability(){
  if(!state.buildCell)return;
  for(const btn of wheelItemsEl.querySelectorAll('[data-build]')){
    const t=TOWER_TYPES[btn.dataset.build]; if(!t)continue;
    btn.classList.toggle('poor',state.gold<t.cost);
  }
}

wheelItemsEl.addEventListener('click',e=>{
  if(performance.now()<wheelArmAt){ e.stopPropagation(); e.preventDefault(); return; }
  const btn=e.target.closest('[data-build]'); if(!btn)return;
  const cell=state.buildCell; if(!cell)return;
  if(placeTower(cell[0],cell[1],btn.dataset.build)) closeBuildWheel();
});
wheelDiscEl.addEventListener('click',e=>{ e.stopPropagation(); });   // 点盘面空白不会误关轮盘
wheelDiscEl.addEventListener('pointerdown',e=>{ e.stopPropagation(); });
wheelCloseEl.addEventListener('click',e=>{
  e.stopPropagation(); e.preventDefault();
  if(performance.now()<wheelArmAt)return;   // 挡住触摸抬起后合成的“幽灵 click”
  closeBuildWheel();
});

/* 屏幕上闪烁的“已选中格子”标记（轮盘可能因靠近边缘而偏移）。 */
function drawWheelAnchor(){
  if(!state.buildCell||state.overlayMode!=='none'||state.gameOver)return;
  const [gx,gy]=state.buildCell; const cell=state.board.cell;
  const x=state.board.x+gx*cell, y=state.board.y+gy*cell;
  const t=performance.now()/1000;
  ctx.save();
  ctx.globalAlpha=.32+.18*Math.sin(t*4);
  ctx.fillStyle='rgba(110,231,255,.32)';
  roundRect(ctx,x+2,y+2,cell-4,cell-4,9); ctx.fill();
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(110,231,255,.92)'; ctx.lineWidth=2.2; ctx.shadowBlur=14; ctx.shadowColor='rgba(110,231,255,.6)';
  roundRect(ctx,x+2,y+2,cell-4,cell-4,9); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(235,250,255,.92)';
  ctx.font=`800 ${clamp(cell*.34,13,22)}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('+',x+cell/2,y+cell/2);
  ctx.restore();
}

/* 沿敌人路径流动的微光虚线：静态箭头指方向，这条带子让道路“活”起来。 */
function drawPathFlow(){
  const cell=state.board.cell, t=performance.now()/1000;
  const col=(currentMap().accentColor||'#6ee7ff');
  ctx.save();
  ctx.strokeStyle=col+'55'; ctx.lineWidth=Math.max(2,cell*.055);
  ctx.lineCap='butt'; ctx.lineJoin='round';
  ctx.setLineDash([cell*.34,cell*1.05]);
  ctx.lineDashOffset=-(t*cell*.9)%(cell*1.39);
  for(const pts of allRoutePointsPx()){
    if(pts.length<2)continue;
    ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();
  }
  ctx.restore();
}


function drawTunnels(){
  if(!state.tunnels.length) return;
  const cell=state.board.cell;
  for(const t of state.tunnels){
    const e=pointAtDistance(t.entryD,t.route), x=pointAtDistance(t.exitD,t.route);
    const ep=pathPointToPx(e.x,e.y), xp=pathPointToPx(x.x,x.y);
    const open=t.status==='open';
    // 已贯通：入口到出口的虚线
    if(open){
      ctx.save();
      ctx.strokeStyle='rgba(201,139,82,.42)'; ctx.lineWidth=Math.max(2,cell*.07);
      ctx.setLineDash([cell*.28,cell*.34]); ctx.lineCap='butt';
      ctx.beginPath(); ctx.moveTo(ep.x,ep.y); ctx.lineTo(xp.x,xp.y); ctx.stroke();
      ctx.restore();
    }
    const hole=(p,label)=>{
      ctx.save();
      const g=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,cell*.36);
      g.addColorStop(0,'rgba(6,4,2,.95)'); g.addColorStop(.55,'rgba(26,16,10,.88)');
      g.addColorStop(.8,'rgba(122,82,50,.55)'); g.addColorStop(1,'rgba(122,82,50,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(p.x,p.y,cell*.36,cell*.27,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(214,164,112,.75)'; ctx.lineWidth=1.6; ctx.setLineDash([cell*.1,cell*.08]);
      ctx.beginPath(); ctx.ellipse(p.x,p.y,cell*.3,cell*.22,0,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      // 碎石
      ctx.fillStyle='rgba(160,120,82,.65)';
      for(let i=0;i<5;i++){
        const a=i*1.7+t.bornAt, r=cell*(.26+.03*((i*37)%5));
        ctx.beginPath(); ctx.arc(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r*.8,cell*.035,0,Math.PI*2); ctx.fill();
      }
      ctx.fillStyle='rgba(255,235,210,.92)'; ctx.font=`800 ${clamp(cell*.17,9,13)}px system-ui`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(label,p.x,p.y);
      ctx.restore();
    };
    hole(ep,'入');
    if(open){
      hole(xp,'出');
    }
  }
}

function tunnelAt(px,py,pad=1){
  const cell=state.board.cell;
  for(const t of state.tunnels){
    const e=pointAtDistance(t.entryD,t.route);
    const ep=pathPointToPx(e.x,e.y);
    if(Math.hypot(ep.x-px,ep.y-py)<=cell*.5*pad) return t;
    if(t.status==='open'){
      const x=pointAtDistance(t.exitD,t.route); const xp=pathPointToPx(x.x,x.y);
      if(Math.hypot(xp.x-px,xp.y-py)<=cell*.5*pad) return t;
    }
  }
  return null;
}

function render(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  const ox=state.shake>0?(Math.random()-.5)*state.shake*2:0;
  const oy=state.shake>0?(Math.random()-.5)*state.shake*2:0;
  ctx.save(); ctx.clearRect(0,0,w,h); ctx.translate(ox,oy);
  drawBackgroundCached();
  drawPathFlow();
  drawBase();
  drawTunnels();
  drawWheelAnchor();
  const cullPad=48, cullW=w+cullPad, cullH=h+cullPad;
  for(const p of state.projectiles){
    if(p.x<-cullPad||p.y<-cullPad||p.x>cullW||p.y>cullH) continue;
    drawProjectile(p);
  }
  for(const t of state.towers){
    const ttype=TOWER_TYPES[t.type];
    if(t.type==='superLaser') drawSuperLaser(t);
    else if(typeof ttype?.customDraw==='function') ttype.customDraw(ctx,t,{cellCenter,towerCenterPx,board:state.board,stats:effectiveStats(t),time:performance.now()/1000});
    else if(ttype?.size===2) drawBigTower(t);
    else drawTower(t);
  }
  for(const e of state.enemies){
    if(!e.alive||e.inTunnel) continue;
    if(e.x<-cullPad||e.y<-cullPad||e.x>cullW||e.y>cullH) continue;
    drawEnemy(e);
  }
  for(const p of state.particles){
    if(p.x<-cullPad||p.y<-cullPad||p.x>cullW||p.y>cullH) continue;
    drawParticle(p);
  }
  for(const t of state.texts){
    if(t.x<-cullPad||t.y<-cullPad||t.x>cullW||t.y>cullH) continue;
    drawText(t);
  }

  // Base-hit red vignette
  if(state.baseFlash>0){
    const a=Math.min(.4,state.baseFlash*.7);
    const vg=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.22,w/2,h/2,Math.max(w,h)*.62);
    vg.addColorStop(0,'rgba(255,40,40,0)'); vg.addColorStop(1,`rgba(255,40,40,${a})`);
    ctx.fillStyle=vg; ctx.fillRect(0,0,w,h);
  }

  if(state.paused&&!state.gameOver){
    ctx.save(); ctx.fillStyle='rgba(4,10,18,.42)'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(223,243,255,.94)'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`800 ${clamp(state.board.cell*.7,22,40)}px system-ui`;
    ctx.fillText('已暂停',w/2,h/2-12);
    ctx.font='13px system-ui'; ctx.fillStyle='rgba(223,243,255,.65)';
    ctx.fillText('按 P 或点击「继续」恢复',w/2,h/2+24);
    ctx.restore();
  }
  if(state.gameOver){
    ctx.save(); ctx.fillStyle='rgba(0,0,0,.62)'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='#ff6b6b'; ctx.font=`bold ${clamp(state.board.cell*.8,28,52)}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('基地陷落',w/2,h/2-30);
    ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='15px system-ui';
    ctx.fillText(`守住 ${Math.max(0,state.wave-1)} 波 · 击杀 ${state.waveKilled} 个敌人`,w/2,h/2+10);
    ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='14px system-ui';
    ctx.fillText('点击画面重开',w/2,h/2+44);
    ctx.restore();
  }
  ctx.restore();
  updateTopStats();
  updateLiveOverlay();
  updateWavePanel();
  drawMiniMap();
}

function towerOccupiesCell(t,cx,cy){
  return towerFootprint(t).some(([fx,fy])=>fx===cx&&fy===cy);
}

/* Per-frame patch of the sidebar wave panel + start button label. */
function updateWavePanel(){
  const tag=document.getElementById('waveTag');
  const bar=document.getElementById('waveProgress');
  const line=document.getElementById('waveStatLine');
  const tagText=state.gameOver?'已结束':state.paused?'已暂停':state.waveState==='spawning'?'进行中':state.waveState==='cleared'?'结算中':'准备中';
  if(tag&&state._uiCache.waveTag!==tagText){
    state._uiCache.waveTag=tagText;
    tag.textContent=tagText;
    tag.style.color=tagText==='进行中'?'var(--amber)':tagText==='已结束'?'var(--rose)':'var(--muted)';
  }
  let pct=0;
  if(state.waveState==='spawning'&&state.waveTotal>0){
    pct=clamp((state.waveKilled+state.waveLeaked)/state.waveTotal,0,1);
  }
  if(bar) bar.style.width=`${(pct*100).toFixed(1)}%`;
  if(line){
    let text='';
    if(state.waveState==='spawning') text=`已出战 ${state.waveSpawned}/${state.waveTotal} · 击杀 ${state.waveKilled} · 漏怪 ${state.waveLeaked}`;
    else if(state.waveState==='ready'&&state.autoWave) text=`自动开波倒计时 ${Math.max(0,state.autoTimer).toFixed(1)}s`;
    else if(state.waveState==='ready') text=`第 ${state.wave} 波 · 点击「开始下一波」或按空格`;
    if(line.textContent!==text) line.textContent=text;
  }
  const startBtn=document.getElementById('startBtn');
  if(startBtn){
    const label=state.gameOver?'已结束':state.waveState==='spawning'?'波次进行中':
      (state.autoWave&&state.waveState==='ready'?`下一波 ${Math.max(0,state.autoTimer).toFixed(1)}s`:'开始下一波');
    if(startBtn.textContent!==label) startBtn.textContent=label;
    startBtn.disabled=state.paused||state.gameOver||state.waveState!=='ready';
  }
}

/* Generic 2×2 footprint renderer for modded "big" towers without a customDraw.
   Simpler sibling of drawSuperLaser — single barrel, hex base, color-driven. */
function drawBigTower(t){
  const c=towerCenterPx(t); const sz=state.board.cell*0.86;
  const col=TOWER_TYPES[t.type].color||[200,200,200];
  const sel=state.selectedTowerId===t.id;
  const st=effectiveStats(t);
  ctx.save(); ctx.translate(c.x,c.y); ctx.scale(towerSpawnScale(t),towerSpawnScale(t));
  ctx.shadowBlur=sel?16:8; ctx.shadowColor=`rgba(${col[0]},${col[1]},${col[2]},.5)`;
  hexPath(ctx,0,0,sz*.9);
  const bg=ctx.createRadialGradient(0,0,4,0,0,sz*.9);
  bg.addColorStop(0,'rgba(255,255,255,.9)'); bg.addColorStop(.5,`rgba(${col[0]},${col[1]},${col[2]},.85)`); bg.addColorStop(1,'rgba(10,14,24,.95)');
  ctx.fillStyle=bg; ctx.fill();
  ctx.strokeStyle=sel?'rgba(255,255,255,.9)':`rgba(${col[0]},${col[1]},${col[2]},.6)`; ctx.lineWidth=2.2; ctx.stroke();
  ctx.fillStyle='rgba(13,17,28,.95)'; ctx.beginPath(); ctx.arc(0,0,sz*.4,0,Math.PI*2); ctx.fill();
  ctx.rotate(t.facingAngle??Math.PI/2);
  const bw=sz*.18,bh=sz*.62;
  const bar=ctx.createLinearGradient(-bw/2,-bh,bw/2,0);
  bar.addColorStop(0,'rgba(255,255,255,.95)'); bar.addColorStop(.4,`rgba(${col[0]},${col[1]},${col[2]},.95)`); bar.addColorStop(1,'rgba(17,24,39,.98)');
  ctx.fillStyle=bar; ctx.fillRect(-bw/2,-bh,bw,bh);
  ctx.restore();
  if(sel){ctx.save();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.8;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(c.x,c.y,st.range*state.board.cell,0,Math.PI*2);ctx.stroke();ctx.restore();}
  if(t.level>1){ctx.save();ctx.fillStyle='rgba(0,0,0,.7)';ctx.beginPath();ctx.arc(c.x+sz*.7,c.y-sz*.7,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd36b';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.level,c.x+sz*.7,c.y-sz*.7);ctx.restore();}
}

/* Patches a few live numbers inside the superLaser overlay panel each frame
   (charge ring, target HP) instead of rebuilding the whole panel — keeps the
   progress bar genuinely live instead of a frozen snapshot. */
function updateLiveOverlay(){
  if(!overlay.classList.contains('show')||state.overlayMode!=='tower')return;
  const t=state.towers.find(x=>x.id===state.selectedTowerId);
  if(!t||t.type!=='superLaser')return;
  const fill=document.getElementById('slChargeFill'); if(!fill)return;
  const charge=Math.max(0,1-t.cooldown/SUPERLASER_COOLDOWN);
  fill.style.width=`${charge*100}%`;
  const label=document.getElementById('slChargeLabel'); if(label) label.textContent=`充能进度 ${Math.round(charge*100)}%`;
  const target=t.targetId?state.enemies.find(e=>e.id===t.targetId&&e.alive):null;
  const hadTarget=!!t._overlayHadTarget;
  if(!!target!==hadTarget){ t._overlayHadTarget=!!target; renderOverlay(t.id); return; }
  if(target){
    const hpFill=document.getElementById('slTargetHpFill');
    if(hpFill) hpFill.style.width=`${(target.hp/target.maxHp)*100}%`;
    const hpLabel=document.getElementById('slTargetHpLabel');
    if(hpLabel) hpLabel.textContent=`HP：${Math.ceil(target.hp)} / ${target.maxHp}`;
    const progLabel=document.getElementById('slTargetProgressLabel');
    if(progLabel) progLabel.textContent=`进度 ${Math.round(target.progress*100)}%`;
  }
}

/* Retriggers a CSS pop animation on an element (removes+reflows+re-adds the
   class so repeated rapid changes each get their own visible pulse). */
function pulseStat(el,dir){
  if(!el)return;
  el.classList.remove('statPopUp','statPopDown');
  void el.offsetWidth; // force reflow so the re-added class restarts the animation
  el.classList.add(dir>0?'statPopUp':'statPopDown');
}

/* Patches the top stat bar (gold / HP / skill points / wave / enemy count)
   every frame so gold ticks up the instant a kill lands, instead of waiting
   for the next full renderStatic() rebuild. Cheap textContent-only diffing —
   safe to call 60×/sec. */
function updateTopStats(){
  const c=state._uiCache;
  if(state.gold!==c.gold){
    const dir=c.gold==null?0:(state.gold>c.gold?1:-1); const prev=c.gold;
    c.gold=state.gold; const el=document.getElementById('statGold');
    if(el){ el.textContent=state.gold; if(prev!=null)pulseStat(el,dir); }
    refreshWheelAffordability();
  }
  const hpCeil=Math.ceil(state.base.hp);
  if(hpCeil!==c.hp||c.hpMax!==state.base.maxHp){
    const dir=c.hp==null?0:(hpCeil>c.hp?1:-1); const prev=c.hp;
    c.hp=hpCeil; c.hpMax=state.base.maxHp; const el=document.getElementById('statHp');
    if(el){ el.textContent=`${hpCeil}/${state.base.maxHp}`; if(prev!=null&&hpCeil!==prev)pulseStat(el,dir); }
  }
  // Live base HP readout in the sidebar (keeps the regen tick visible between
  // the otherwise event-driven renderStatic() rebuilds).
  if(hpCeil!==c.baseHpShown||c.baseHpMaxShown!==state.base.maxHp){
    c.baseHpShown=hpCeil; c.baseHpMaxShown=state.base.maxHp;
    const pct=state.base.hp/state.base.maxHp;
    const fill=document.getElementById('baseHpFill');
    if(fill) fill.style.width=`${pct*100}%`;
    const txt=document.getElementById('baseHpText');
    if(txt){
      txt.textContent=`${hpCeil}/${state.base.maxHp}`;
      txt.style.color=pct>.6?'#4ade80':pct>.3?'#fbbf24':'#f87171';
    }
  }
  const regenNow=baseRegenPerSec();
  if(regenNow!==c.regenShown){
    c.regenShown=regenNow;
    const rtxt=document.getElementById('baseRegenText');
    if(rtxt){
      rtxt.textContent=regenNow>0?`+${regenNow.toFixed(1)} HP/秒`:'未解锁';
      rtxt.style.color=regenNow>0?'var(--green)':'rgba(255,255,255,.35)';
    }
  }
  if(state.skillPoints!==c.skillPoints){
    const dir=c.skillPoints==null?0:(state.skillPoints>c.skillPoints?1:-1); const prev=c.skillPoints;
    c.skillPoints=state.skillPoints; const el=document.getElementById('statSp');
    if(el){ el.textContent=state.skillPoints; if(prev!=null)pulseStat(el,dir); }
  }
  if(state.wave!==c.wave){
    const prev=c.wave; c.wave=state.wave; const el=document.getElementById('statWave');
    if(el){ el.textContent=state.wave; if(prev!=null)pulseStat(el,1); }
  }
  let ec=0;
  for(const e of state.enemies) if(e.alive) ec++;
  if(ec!==c.enemyCount){
    c.enemyCount=ec;
    const el=document.getElementById('statEnemyCount'); if(el)el.textContent=ec;
    const el2=document.getElementById('statRemain'); if(el2)el2.textContent=ec;
  }
  const kt=codexKillTotal();
  if(kt!==c.codexKills){
    c.codexKills=kt;
    const el=document.getElementById('codexSummary');
    if(el) el.textContent=codexSummaryText();
  }
}

/* 拖动松手后的镜头惯性（触屏/鼠标都能“滑”一下）。 */
function stepCameraMomentum(dt){
  const c=state.camera;
  if(!c.needsCam||boardDragging)return;
  if(!c.vx&&!c.vy)return;
  const tx=c.x+c.vx*dt, ty=c.y+c.vy*dt;
  c.x=tx; c.y=ty; updateCameraOffset();
  if(Math.abs(c.x-tx)>.5) c.vx=0;   // 撞到地图边界就停下
  if(Math.abs(c.y-ty)>.5) c.vy=0;
  const decay=Math.exp(-6*dt);
  c.vx*=decay; c.vy*=decay;
  if(Math.abs(c.vx)<20) c.vx=0;
  if(Math.abs(c.vy)<20) c.vy=0;
}
function loop(now){ const dt=Math.min((now-state.last)/1000,.033); state.last=now; update(dt*state.gameSpeed); stepCameraMomentum(dt); render(); requestAnimationFrame(loop); }
